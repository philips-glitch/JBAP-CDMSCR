<html lang="en">
<head>

<title>CDMS Post-Auction V2 Concept</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e3e6eb;--pri:#1f5fbf;--ok:#1a7f4b;--warn:#b26b00;--bad:#c0362c;--soft:#eef3fb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#14213d;color:#fff}
header h1{font-size:16px;margin:0;font-weight:600}
header .tag{background:#f4b400;color:#14213d;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:700}
header label{font-size:12px;opacity:.85}
header select{margin-left:4px}
header .today{margin-left:auto;font-size:13px}
.wrap{display:grid;grid-template-columns:190px 1fr 300px;min-height:calc(100vh - 46px)}
nav{background:#fff;border-right:1px solid var(--line);padding:12px 0}
nav a{display:flex;justify-content:space-between;padding:8px 16px;color:var(--ink);text-decoration:none}
nav a.on{background:var(--soft);color:var(--pri);font-weight:600;border-left:3px solid var(--pri)}

nav .n.z{background:#cfd4dc}
nav .sep{margin:12px 16px 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
main{padding:16px 20px;overflow:auto}
aside{background:#fff;border-left:1px solid var(--line);padding:12px;overflow:auto}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}

.task .sev{width:6px;align-self:stretch;border-radius:3px;background:var(--warn)}
.task .sev.high{background:var(--bad)} .task .sev.low{background:#9aa4b2}
.task .body{flex:1}
.task .t{font-weight:600}

.btn.o{background:#fff;color:var(--pri)}
.btn.r{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:#fafbfc}
td.num,th.num{text-align:right}
a.lk{color:var(--pri);cursor:pointer;text-decoration:none}
.chip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid;white-space:nowrap}
.c-auto{color:var(--ok);border-color:#9fd3b6;background:#eef8f2}
.c-link{color:#6b3fb3;border-color:#c9b5ec;background:#f4effc}

.steps{display:flex;flex-wrap:wrap;gap:0;margin:6px 0}

.step.done{border-color:var(--ok)} .step.cur{border-color:var(--warn);background:#fffaf0}
.step .h{font-size:12px;font-weight:600}

.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.track h4{margin:0 0 6px;font-size:13px}
.track .step{min-width:0;margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar .lab{width:210px;font-size:13px}
.bar .b{height:18px;background:var(--pri);border-radius:3px;min-width:2px}
.bar .c{font-size:13px;color:var(--mut)}
.next{border-left:4px solid var(--warn);background:#fffaf0}
.next.none{border-color:var(--ok);background:#f3faf6}
details summary{cursor:pointer;color:var(--mut);margin:6px 0}
.feed{font-size:12px}
.feed div{padding:6px 0;border-bottom:1px dashed var(--line)}

aside h3{font-size:13px;margin:6px 0 8px}

@media (max-width:1100px){.wrap{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;border:0}nav .sep{display:none}aside{border:0}.tracks,.grid2,.kpis{grid-template-columns:1fr}}
@media print{aside,nav,header select{display:none}.wrap{display:block}}

<body>
<header>
  <h1>CDMS · Post-Auction</h1><span class="tag">V2 CONCEPT · SCRATCH UI</span>
  <label>Viewing as <select id="role">
    <option value="ALL">All roles</option><option value="SMD">SMD</option><option value="FAD">FAD</option>
    <option value="VWD">VWD</option><option value="APPROVER">President / Managers</option></select></label>

</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside>
    <h3>Simulate events</h3>
    <p class="note">In V2 most dates are set by events, not typed. Press a button and watch the lots move by themselves (feed below).</p>
    <button class="btn o" data-sim="bank">Import bank statement (CSV)</button>
    <button class="btn o" data-sim="seller">Seller clicks the link in an email</button>
    <button class="btn o" data-sim="kyc">Buyer completes KYC in the portal</button>
    <button class="btn" data-sim="day">Next working day ▶</button>
    <button class="btn o" data-sim="reset">Reset demo</button>

    <div class="feed" id="feed"></div>
  </aside>
</div>
<script>
/* ===== Dates (working days skip Sat/Sun and the holiday list; dates below are [MOCK]) ===== */
const HOL=['2026-11-30','2026-12-08','2026-12-24','2026-12-25','2026-12-30','2026-12-31'];
const pad=n=>String(n).padStart(2,'0');
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isWD=d=>d.getDay()%6!==0&&!HOL.includes(iso(d));
const addWD=(s,n)=>{const d=toD(s);while(n>0){d.setDate(d.getDate()+1);if(isWD(d))n--;}return iso(d)};
const wdBetween=(a,b)=>{let n=0;const d=toD(a),e=toD(b);while(d<e){d.setDate(d.getDate()+1);if(isWD(d))n++;}return n};
const calDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const fmt=s=>s?toD(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const peso=n=>'₱'+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Seller parameters (codes as in the V1 prototype; rules simplified) ===== */
const SELLERS={
  EWB:{release:'seller_ack',doas:'branch',fee:1000},
  SBC:{release:'seller_ack',doas:'jbap',fee:400},
  TFS:{release:'buyer_payment',doas:'none',fee:500},
  ORICO:{release:'doas',doas:'jbap',fee:500}};
const RELEASE_TXT={seller_ack:'after Seller Acknowledgement',buyer_payment:'after Buyer Payment',doas:'after Buyer Payment + signed DOAS'};
const SRC={auto:'Auto',link:'Via link',click:'1-click',scan:'Scan',manual:'Typed'};
const EV={sold:'Sold at auction',kyc:'Buyer KYC approved',saaf_sent:'SAAF sent to seller',saaf_ok:'Seller approved SAAF',
  rebate:'Rebate decided',baaf:'Awarded (BAAF sent)',paid:'Buyer paid',seller_paid:'Seller paid',comm_billed:'Commission billed',
  seller_ack:'Seller acknowledged',doas_sent:'DOAS sent for signing',doas_back:'Signed DOAS received',docs_in:'Documents from seller',
  docs_out:'Documents to buyer',dispatch:'Dispatch notice sent',release:'Unit released'};

/* ===== Dummy data (anonymised: Sample Buyer A–F, plates XAA/XEW…) ===== */
const BUYERS={D9001:'Sample Buyer A',D9002:'Sample Buyer B',D9003:'Sample Buyer C',D9004:'Sample Buyer D',D9005:'Sample Buyer E',D9006:'Sample Buyer F'};
const E=(d,src='auto',by)=>({d,src,by:by||({auto:'System',link:'via link',click:'user',scan:'FAD (scan)',manual:'user'})[src]});
function seed(){
  const L=(id,auc,lot,plate,model,seller,buyer,price,ev,x={})=>Object.assign({id,auc,lot,plate,model,seller,buyer,price,ev},x);
  const lots=[
    L('L01',231,101,'XAA1001','Toyota Vios 1.3 E','EWB','D9001',420000,{sold:E('2026-11-02')}),
    L('L02',231,102,'XAA1002','Mitsubishi Mirage G4','SBC','D9002',385000,{sold:E('2026-11-02'),kyc:E('2026-11-02','link','Buyer (portal)'),saaf_sent:E('2026-11-02')}),
    L('L03',231,103,'XAA1003','Toyota Innova 2.8 G','TFS','D9003',1120000,{sold:E('2026-11-02'),kyc:E('2026-11-02','link','Buyer (portal)'),saaf_sent:E('2026-11-02'),saaf_ok:E('2026-11-03','link','TFS (link)')},{rebate:{amt:15000,status:'pending',req:'2026-11-04'}}),
    L('L04',231,104,'XAA1004','Honda City 1.5 S','ORICO','D9001',610000,{sold:E('2026-11-02'),kyc:E('2026-11-02','link','Buyer (portal)'),saaf_sent:E('2026-11-02'),saaf_ok:E('2026-11-04','link','ORICO (link)'),baaf:E('2026-11-04')},{pay:'ok'}),
    L('L05',230,110,'XEW1005','Ford Ranger XLT','EWB','D9004',890000,{sold:E('2026-10-26'),kyc:E('2026-10-26','link','Buyer (portal)'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-27','link','EWB (link)'),baaf:E('2026-10-28')}),
    L('L06',230,111,'XAA1006','Nissan Almera 1.5','SBC','D9002',455000,{sold:E('2026-10-26'),kyc:E('2026-10-27','link','Buyer (portal)'),saaf_sent:E('2026-10-27'),saaf_ok:E('2026-10-30','link','SBC (link)'),baaf:E('2026-11-03')},{pay:'short'}),
    L('L07',230,112,'XAA1007','Toyota Fortuner 2.4 G','TFS','D9005',1350000,{sold:E('2026-10-26'),kyc:E('2026-10-26','link','Buyer (portal)'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-27','link','TFS (link)'),baaf:E('2026-10-28'),paid:E('2026-10-30','auto','System (bank match)'),dispatch:E('2026-10-30')}),
    L('L08',230,113,'XAA1008','Suzuki Ertiga GL','ORICO','D9006',640000,{sold:E('2026-10-26'),kyc:E('2026-10-26','link','Buyer (portal)'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-26','link','ORICO (link)'),baaf:E('2026-10-26'),paid:E('2026-10-28','auto','System (bank match)'),doas_sent:E('2026-10-28'),seller_paid:E('2026-11-03','click','FAD Manager'),comm_billed:E('2026-11-03')}),
    L('L09',229,120,'XAA1009','Hyundai Accent 1.6','SBC','D9003',398000,{sold:E('2026-10-19'),kyc:E('2026-10-19','link','Buyer (portal)'),saaf_sent:E('2026-10-19'),saaf_ok:E('2026-10-20','link','SBC (link)'),baaf:E('2026-10-21'),paid:E('2026-10-26','auto','System (bank match)'),doas_sent:E('2026-10-26'),doas_back:E('2026-10-28','scan'),seller_paid:E('2026-10-28','click','FAD Manager'),comm_billed:E('2026-10-28'),seller_ack:E('2026-10-29','link','SBC (link)'),dispatch:E('2026-10-29'),release:E('2026-11-02','click','VWD'),docs_in:E('2026-11-04','scan')}),
    L('L10',229,121,'XAA1010','Toyota Wigo 1.0 G','TFS','D9004',345000,{sold:E('2026-10-19'),kyc:E('2026-10-19','link','Buyer (portal)'),saaf_sent:E('2026-10-19'),saaf_ok:E('2026-10-19','link','TFS (link)'),baaf:E('2026-10-20'),paid:E('2026-10-21','auto','System (bank match)'),dispatch:E('2026-10-21'),seller_paid:E('2026-10-23','click','FAD Manager'),comm_billed:E('2026-10-23'),release:E('2026-10-23','click','VWD'),seller_ack:E('2026-10-26','link','TFS (link)'),docs_in:E('2026-10-27','scan'),docs_out:E('2026-10-28','click','FAD')}),
    L('L11',231,105,'XEW1011','Toyota Hilux 2.4 E','EWB','D9006',980000,{sold:E('2026-11-03'),kyc:E('2026-11-05','link','Buyer (portal)')}),
    L('L12',230,114,'XEW1012','Mitsubishi Montero GLS','EWB','D9001',1240000,{sold:E('2026-10-26'),kyc:E('2026-10-26','link','Buyer (portal)'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-28','link','EWB (link)'),baaf:E('2026-10-29'),paid:E('2026-11-04','auto','System (bank match)'),doas_sent:E('2026-11-04')}),
    L('L13',229,122,'XAA1013','Isuzu D-Max LS','SBC','D9005',760000,{sold:E('2026-10-19'),kyc:E('2026-10-19','link','Buyer (portal)'),saaf_sent:E('2026-10-19'),saaf_ok:E('2026-10-20','link','SBC (link)'),baaf:E('2026-10-21')},{cancel:{d:'2026-10-28',fee:10000,waived:false,feePaid:null},pay:'fee'}),
    L('L14',231,106,'XAA1014','Kia Picanto 1.2 EX','ORICO','D9005',330000,{sold:E('2026-11-03'),kyc:E('2026-11-03','link','Buyer (portal)'),saaf_sent:E('2026-11-03'),saaf_ok:E('2026-11-04','link','ORICO (link)'),baaf:E('2026-11-05')},{pay:'ok'})
  ];
  return {today:'2026-11-06',lots,exceptions:[],feed:[],
    approvals:[{id:1,type:'Rebate',lot:'L03',detail:'Rebate ₱15,000 requested by SMD (buyer asked after inspection)',role:'President',status:'pending'}],seq:2};
}
let S=seed();
let ROLE='ALL';
const lot=id=>S.lots.find(l=>l.id===id);
const log=(msg,src='auto')=>S.feed.unshift({d:S.today,msg,src});
const label=l=>`A${l.auc}-${l.lot} ${l.plate}`;

/* ===== Lot rules ===== */
const deadline=l=>l.ev.baaf?(l.deadlineOverride||addWD(l.ev.baaf.d,3)):null;
const rebateDone=l=>!l.rebate||l.rebate.status!=='pending';
function dispatchReady(l){const s=SELLERS[l.seller];if(!l.ev.paid)return false;
  if(s.release==='buyer_payment')return true;if(s.release==='seller_ack')return !!l.ev.seller_ack;return !!l.ev.doas_back}
const releaseBlock=l=>(SELLERS[l.seller].doas!=='none'&&!l.ev.doas_back)?'Signed DOAS not received yet':null;
function penalty(l){if(!l.ev.dispatch||l.ev.release)return 0;const dl=addWD(l.ev.dispatch.d,3);return Math.max(0,calDays(dl,S.today))*500}
const money=l=>{const s=SELLERS[l.seller],com=l.price*.05,vat=com*.12,reb=(l.rebate&&l.rebate.status==='approved')?l.rebate.amt:0;
  return {fee:s.fee,buyer:l.price+s.fee-reb,com,vat,reb,payable:l.price+s.fee-com-vat}};
const closed=l=>l.cancel?(l.cancel.waived||!!l.cancel.feePaid):!!(l.ev.release&&l.ev.docs_out&&l.ev.seller_ack&&l.ev.comm_billed);

function stage(l){
  if(l.cancel)return {k:'cancelled',t:closed(l)?'Cancelled · closed':'Cancelled · fee unpaid',who:closed(l)?null:'Buyer'};
  if(!l.ev.kyc)return {k:'kyc',t:'Waiting buyer KYC',who:'Buyer'};
  if(!l.ev.saaf_sent)return {k:'saaf',t:'SAAF queued (system)',who:'System'};
  if(!l.ev.saaf_ok)return {k:'saaf',t:'Waiting seller approval',who:'Seller'};
  if(!rebateDone(l))return {k:'rebate',t:'Rebate waiting for President',who:'President'};
  if(!l.ev.baaf)return {k:'award',t:'BAAF queued (system)',who:'System'};
  if(!l.ev.paid)return {k:'pay',t:S.today>deadline(l)?'Unpaid · overdue':'Waiting buyer payment',who:'Buyer'};
  if(closed(l))return {k:'closed',t:'Closed',who:null};
  return {k:'after',t:'Paid · settlement, documents, release',who:'Several'};
}

/* ===== Automation engine: runs after every event and every new day ===== */
function runAuto(){
  for(const l of S.lots){
    if(l.cancel)continue;const e=l.ev,s=SELLERS[l.seller];
    if(e.kyc&&!e.saaf_sent){e.saaf_sent=E(S.today);log(`${label(l)}: SAAF emailed to ${l.seller} with an approve link (KYC was approved)`)}
    if(e.saaf_ok&&rebateDone(l)&&!e.baaf){e.baaf=E(S.today);log(`${label(l)}: BAAF emailed to ${BUYERS[l.buyer]}; pay by ${fmt(deadline(l))}`)}
    if(e.baaf&&!e.paid&&addWD(S.today,1)===deadline(l)&&l.reminded!==S.today){l.reminded=S.today;log(`${label(l)}: payment reminder sent to the buyer (deadline is the next working day)`)}
    if(e.paid&&s.doas!=='none'&&!e.doas_sent){e.doas_sent=E(S.today);log(`${label(l)}: ${s.doas==='branch'?'EWB call-out notice':'DOAS for signature'} emailed to the buyer`)}
    if(dispatchReady(l)&&!e.dispatch){e.dispatch=E(S.today);log(`${label(l)}: dispatch notice sent; pull out by ${fmt(addWD(S.today,3))}`)}
    if(e.seller_paid&&!e.comm_billed){e.comm_billed=E(S.today);log(`${label(l)}: commission billing generated for ${l.seller}`)}
  }
}

/* ===== Tasks (only what needs a person; waiting items are listed apart) ===== */
function tasks(){
  const T=[],W=[];const t=S.today;
  for(const l of S.lots){const e=l.ev,s=SELLERS[l.seller],st=stage(l);
    if(l.cancel){if(!closed(l))W.push({who:'Buyer',l,txt:`Cancellation fee ${peso(l.cancel.fee)} billed ${fmt(l.cancel.d)}; matched automatically when paid`});continue}
    if(!e.kyc){const n=wdBetween(e.sold.d,t);(n>=2?T:W).push(n>=2?{role:'SMD',sev:'med',l,title:'Buyer KYC still missing',m:`${n} working days since the sale. Automatic reminders got no response.`,acts:[['Remind buyer','remindKyc']]}:{who:'Buyer',l,txt:'KYC in the buyer portal'});continue}
    if(e.saaf_sent&&!e.saaf_ok){const n=wdBetween(e.saaf_sent.d,t);(n>=2?T:W).push(n>=2?{role:'SMD',sev:'med',l,title:`${l.seller} has not approved the SAAF`,m:`Sent ${fmt(e.saaf_sent.d)} (${n} working days).`,acts:[['Nudge seller','nudge']]}:{who:l.seller,l,txt:'SAAF approval (link in email)'});continue}
    if(!rebateDone(l)){W.push({who:'President',l,txt:'Rebate decision (Approvals)'});continue}
    if(e.baaf&&!e.paid){const dl=deadline(l);if(t>dl)T.push({role:'SMD',sev:'high',l,title:'Unpaid after the deadline',m:`Deadline ${fmt(dl)}. Reminders were sent automatically. Decide now.`,acts:[['Cancel sale (fee auto-billed)','cancel'],['Request +2 days','extend']]});
      else W.push({who:'Buyer',l,txt:`Payment, deadline ${fmt(dl)}`});continue}
    if(!e.paid)continue;
    if(!e.seller_paid&&!T.some(x=>x.key==='run'))T.push({key:'run',role:'FAD',sev:'med',l:null,title:'Seller settlement run is ready',m:`${S.lots.filter(x=>x.ev.paid&&!x.ev.seller_paid&&!x.cancel).length} paid lots; payable and commission already computed.`,acts:[['Open settlement run','gorun']]});
    if(e.seller_paid&&!e.seller_ack)W.push({who:l.seller,l,txt:'Seller acknowledgement (link)'});
    if(e.doas_sent&&!e.doas_back){if(s.doas==='jbap')T.push({role:'FAD',sev:'low',l,title:'Signed DOAS: scan when it arrives',m:`DOAS sent ${fmt(e.doas_sent.d)}. Scanning the transmittal QR records the date.`,acts:[['Scan signed DOAS','scanDoas']]});
      else W.push({who:'EWB',l,txt:'DOAS signing at EWB branch (EWB confirms via link)'})}
    if(e.seller_paid&&(s.doas==='none'||e.doas_back)&&!e.docs_in)T.push({role:'FAD',sev:'low',l,title:'Documents from seller: scan on receipt',m:'ORCR / deed package from the seller.',acts:[['Scan documents','scanDocs']]});
    if(e.dispatch&&!e.release){const p=penalty(l),b=releaseBlock(l);T.push({role:'VWD',sev:p?'high':'med',l,title:p?`Unit overdue · penalty ${peso(p)} accruing`:'Ready for pull-out',m:`Pull-out deadline ${fmt(addWD(e.dispatch.d,3))}.${b?' Blocked: '+b+'.':''}`,acts:[['Release unit','release']]})}
    else if(e.paid&&!e.dispatch)W.push({who:SELLERS[l.seller].release==='seller_ack'?l.seller:'Buyer',l,txt:`Dispatch condition: ${RELEASE_TXT[s.release]}`});
    if(e.docs_in&&e.release&&!e.docs_out)T.push({role:'FAD',sev:'low',l,title:'Hand documents to buyer',m:'Unit already released; documents are in.',acts:[['Mark handed over','docsOut']]});
  }
  for(const x of S.exceptions)T.unshift({role:'FAD',sev:'high',l:lot(x.lot),title:'Bank payment does not match',m:`${peso(x.amt)} received from ${BUYERS[lot(x.lot).buyer]}; expected ${peso(money(lot(x.lot)).buyer)}.`,acts:[['Accept & match','match'],['Ask buyer for the balance','short']]});
  for(const a of S.approvals.filter(a=>a.status==='pending'))T.push({role:'APPROVER',sev:'med',l:lot(a.lot),title:`${a.type} approval (${a.role})`,m:a.detail,acts:[['Approve','approve:'+a.id],['Reject','reject:'+a.id]]});
  return {T,W};
}
const roleOk=r=>ROLE==='ALL'||ROLE===r;

/* ===== Actions ===== */
const ACT={
  remindKyc:l=>log(`${label(l)}: KYC reminder sent to the buyer (SMD)`,'click'),
  nudge:l=>log(`${label(l)}: SAAF reminder resent to ${l.seller} (SMD)`,'click'),
  cancel:l=>{if(!confirm(`Cancel ${label(l)}? The PHP 10,000 fee is billed to the buyer automatically.`))return;
    const waive=confirm('Ask the President to waive the fee? (OK = request waiver, Cancel = bill the fee)');
    l.cancel={d:S.today,fee:10000,waived:false,feePaid:null};log(`${label(l)}: sale cancelled; fee ₱10,000 billed by email`,'click');
    if(waive)S.approvals.push({id:S.seq++,type:'Fee waiver',lot:l.id,detail:`Waive ₱10,000 fee on ${label(l)}`,role:'President',status:'pending'})},
  extend:l=>{S.approvals.push({id:S.seq++,type:'Deadline extension',lot:l.id,detail:`+2 working days for ${label(l)} (from ${fmt(deadline(l))})`,role:'FAD Manager',status:'pending'});log(`${label(l)}: extension requested (SMD)`,'click')},
  gorun:()=>go('#/settlement'),
  scanDoas:l=>{l.ev.doas_back=E(S.today,'scan');log(`${label(l)}: signed DOAS scanned in`,'scan')},
  scanDocs:l=>{l.ev.docs_in=E(S.today,'scan');log(`${label(l)}: seller documents scanned in`,'scan')},
  docsOut:l=>{l.ev.docs_out=E(S.today,'click','FAD');log(`${label(l)}: documents handed to the buyer`,'click')},
  release:l=>{const b=releaseBlock(l);if(b){alert('Cannot release: '+b+'.');return}
    const p=penalty(l);if(p&&!confirm(`Storage penalty ${peso(p)}. Collect it at the cashier now? (receipt is issued automatically)`))return;
    if(p)l.penaltyPaid=p;l.ev.release=E(S.today,'click','VWD');
    if(l.ev.docs_in&&!l.ev.docs_out)l.ev.docs_out=E(S.today,'click','VWD');
    log(`${label(l)}: released${p?`; penalty ${peso(p)} collected`:''}`,'click')},
  match:l=>{S.exceptions=S.exceptions.filter(x=>x.lot!==l.id);l.ev.paid=E(S.today,'click','FAD (manual match)');log(`${label(l)}: payment matched by FAD`,'click')},
  short:l=>{S.exceptions=S.exceptions.filter(x=>x.lot!==l.id);l.pay='ok';log(`${label(l)}: balance request emailed to the buyer`,'click')},
  rebate:l=>{const v=prompt('Rebate amount (PHP)','10000');if(!v)return;l.rebate={amt:+v,status:'pending',req:S.today};
    S.approvals.push({id:S.seq++,type:'Rebate',lot:l.id,detail:`Rebate ${peso(+v)} on ${label(l)}`,role:'President',status:'pending'});log(`${label(l)}: rebate requested (SMD)`,'click')}
};
function decide(id,ok){const a=S.approvals.find(a=>a.id===+id),l=lot(a.lot);
  if(!ok&&!prompt('Reason for rejecting'))return;a.status=ok?'approved':'rejected';
  if(a.type==='Rebate'){l.rebate.status=a.status;l.ev.rebate=E(S.today,'click','President')}
  if(a.type==='Deadline extension'&&ok)l.deadlineOverride=addWD(deadline(l),2);
  if(a.type==='Fee waiver'&&ok){l.cancel.waived=true;l.cancel.fee=0}
  log(`${label(l)}: ${a.type} ${a.status} (${a.role})`,'click')}
const SIM={
  bank:()=>{let n=0;for(const l of S.lots){
      if(l.cancel&&l.pay==='fee'&&!l.cancel.feePaid&&!l.cancel.waived){l.cancel.feePaid=S.today;n++;log(`${label(l)}: cancellation fee matched from the bank file`);continue}
      if(l.cancel||!l.ev.baaf||l.ev.paid)continue;
      if(l.pay==='ok'){l.ev.paid=E(S.today,'auto','System (bank match)');n++;log(`${label(l)}: buyer payment matched from the bank file`)}
      else if(l.pay==='short'&&!S.exceptions.some(x=>x.lot===l.id)){S.exceptions.push({lot:l.id,amt:money(l).buyer-5000});log(`${label(l)}: payment short by ₱5,000; sent to FAD as an exception`)}}
    if(!n&&!S.exceptions.length)log('Bank file imported: nothing new to match')},
  seller:()=>{const l=S.lots.find(l=>!l.cancel&&l.ev.saaf_sent&&!l.ev.saaf_ok)||S.lots.find(l=>l.ev.seller_paid&&!l.ev.seller_ack)||S.lots.find(l=>SELLERS[l.seller].doas==='branch'&&l.ev.doas_sent&&!l.ev.doas_back);
    if(!l)return log('No email is waiting for a seller');
    if(!l.ev.saaf_ok){l.ev.saaf_ok=E(S.today,'link',`${l.seller} (link)`);log(`${label(l)}: ${l.seller} approved the SAAF from the email link`,'link')}
    else if(!l.ev.seller_ack&&l.ev.seller_paid){l.ev.seller_ack=E(S.today,'link',`${l.seller} (link)`);log(`${label(l)}: ${l.seller} acknowledged payment from the email link`,'link')}
    else{l.ev.doas_back=E(S.today,'link','EWB (link)');log(`${label(l)}: EWB confirmed the DOAS was signed at the branch`,'link')}},
  kyc:()=>{const l=S.lots.find(l=>!l.ev.kyc);if(!l)return log('No buyer is waiting for KYC');l.ev.kyc=E(S.today,'link','Buyer (portal)');log(`${label(l)}: buyer finished KYC in the portal`,'link')},
  day:()=>{S.today=addWD(S.today,1);log(`— New working day: ${fmt(S.today)} —`)},
  reset:()=>{S=seed();runAuto()}
};

/* ===== Views ===== */
const chip=src=>`<span class="chip c-${src}">${SRC[src]}</span>`;
function stepBox(l,k,lab,cur){const e=l.ev[k];return `<div class="step ${e?'done':cur?'cur':''}"><div class="h">${lab||EV[k]}</div><div class="d">${e?`${fmt(e.d)} · ${esc(e.by)} ${chip(e.src)}`:cur?'next':'—'}</div></div>`}
function lotLink(l){return l?`<a class="lk" href="#/lot/${l.id}">${label(l)}</a>`:''}
function stClass(st){return st.k==='closed'?'ok':/overdue|fee unpaid/.test(st.t)?'bad':st.k==='after'?'w':''}

function vTasks(){const {T,W}=tasks();const mine=T.filter(x=>roleOk(x.role));
  const order={high:0,med:1,low:2};mine.sort((a,b)=>order[a.sev]-order[b.sev]);
  return `<h2>My Tasks</h2><p class="sub">Only the work that needs a person, most urgent first. Everything else moves by itself. ${ROLE==='ALL'?'Pick a role in the header to see one team’s list.':''}</p>
  ${mine.length?mine.map(x=>`<div class="card task"><div class="sev ${x.sev}"></div><div class="body">
    <div class="t">${esc(x.title)} ${x.l?'· '+lotLink(x.l):''} <span class="st">${x.role==='APPROVER'?'Approver':x.role}</span></div>
    <div class="m">${esc(x.m)}</div>
    <div>${x.acts.map(([t,a])=>`<button class="btn ${/Reject|Cancel sale/.test(t)?'o':''}" data-act="${a}" data-lot="${x.l?x.l.id:''}">${esc(t)}</button>`).join('')}</div></div></div>`).join(''):'<div class="card">Nothing needs you right now.</div>'}
  <details><summary>Waiting on buyer, seller or approver: ${W.length} lots (no action needed; the system reminds them)</summary>
  <table><tr><th>Lot</th><th>Waiting on</th><th>For</th></tr>${W.map(w=>`<tr><td>${lotLink(w.l)}</td><td>${esc(w.who)}</td><td>${esc(w.txt)}</td></tr>`).join('')}</table></details>`}

function vLots(){return `<h2>All units</h2><p class="sub">One row per lot, whatever department you are in. The V1 prototype splits these across ~20 lists.</p>
  <table><tr><th>Lot</th><th>Make / Model</th><th>Seller</th><th>Buyer</th><th>Stage</th><th>Waiting on</th></tr>
  ${S.lots.map(l=>{const st=stage(l);return `<tr><td>${lotLink(l)}</td><td>${esc(l.model)}</td><td>${l.seller}</td><td>${BUYERS[l.buyer]}</td><td><span class="st ${stClass(st)}">${st.t}</span></td><td>${st.who||'—'}</td></tr>`}).join('')}</table>`}

function vLot(id){const l=lot(id);if(!l)return '<p>Not found</p>';const s=SELLERS[l.seller],st=stage(l),m=money(l),e=l.ev;
  const {T,W}=tasks();const my=T.filter(t=>t.l&&t.l.id===id),wt=W.filter(w=>w.l.id===id);
  const main=['sold','kyc','saaf_sent','saaf_ok'].concat(l.rebate?['rebate']:[]).concat(['baaf','paid']);
  const firstMissing=main.find(k=>!e[k]);
  const trk=(title,keys)=>{const f=keys.find(k=>!e[k]);return `<div class="track"><h4>${title}</h4>${keys.map(k=>stepBox(l,k,null,e.paid&&k===f)).join('')}</div>`};
  const docKeys=(s.doas==='none'?[]:['doas_sent','doas_back']).concat(['docs_in','docs_out']);
  const canRebate=!e.baaf&&!l.rebate&&!l.cancel&&roleOk('SMD'),canCancel=!e.release&&!l.cancel&&roleOk('SMD');
  return `<p><a class="lk" href="#/lots">← All units</a></p>
  <h2>${label(l)} · ${esc(l.model)}</h2>
  <p class="sub">Seller ${l.seller} (dispatch ${RELEASE_TXT[s.release]}; DOAS ${s.doas==='none'?'not used':s.doas==='branch'?'signed at seller branch':'signed at JBAP'}) · Buyer ${BUYERS[l.buyer]} (${l.buyer}) · <span class="st ${stClass(st)}">${st.t}</span></p>
  <div class="card next ${my.length?'':'none'}"><b>${my.length?'Needs a person':'No action needed'}</b>
    ${my.map(x=>`<div>${esc(x.title)} (${x.role==='APPROVER'?'Approver':x.role}): ${esc(x.m)} ${x.acts.map(([t,a])=>`<button class="btn" data-act="${a}" data-lot="${id}">${esc(t)}</button>`).join('')}</div>`).join('')}
    ${wt.map(w=>`<div class="m">Waiting on ${esc(w.who)}: ${esc(w.txt)}</div>`).join('')}
    ${!my.length&&!wt.length&&!closed(l)?'<div class="m">The system handles the next step.</div>':''}
    <div>${canRebate?`<button class="btn o" data-act="rebate" data-lot="${id}">Request rebate</button>`:''}${canCancel?`<button class="btn o" data-act="cancel" data-lot="${id}">Cancel sale</button>`:''}</div></div>
  ${l.cancel?`<div class="card"><b>Cancelled ${fmt(l.cancel.d)}</b> · fee ${peso(l.cancel.fee)}${l.cancel.waived?' (waived)':''} · ${l.cancel.feePaid?'fee paid '+fmt(l.cancel.feePaid):l.cancel.waived?'':'fee unpaid'}</div>`:''}
  <div class="card"><b>Sale → payment</b><div class="steps">${main.map(k=>stepBox(l,k,null,k===firstMissing&&!l.cancel)).join('')}</div>
  ${e.baaf&&!e.paid?`<div class="m">Payment deadline ${fmt(deadline(l))}${l.deadlineOverride?' (extended)':''}</div>`:''}</div>
  <div class="card"><b>After payment: three tracks run in parallel</b><p class="note">In V1 these are separate lists in FAD, SMD and VWD. Here they sit on one page.</p>
  <div class="tracks">${trk('Seller settlement',['seller_paid','comm_billed','seller_ack'])}${trk('Documents',docKeys)}${trk('Release',['dispatch','release'])}</div>
  ${e.dispatch&&!e.release?`<p class="m">Pull-out deadline ${fmt(addWD(e.dispatch.d,3))} · penalty now ${peso(penalty(l))}</p>`:''}${l.penaltyPaid?`<p class="m">Penalty collected ${peso(l.penaltyPaid)}</p>`:''}</div>
  <div class="grid2"><div class="card"><b>Money</b> <span class="note">(illustrative rates)</span><table>
    <tr><td>Awarded price</td><td class="num">${peso(l.price)}</td></tr><tr><td>Notarial / transfer fee</td><td class="num">${peso(m.fee)}</td></tr>
    ${m.reb?`<tr><td>Rebate (approved)</td><td class="num">−${peso(m.reb)}</td></tr>`:''}<tr><th>Buyer pays</th><th class="num">${peso(m.buyer)}</th></tr>
    <tr><td>Commission 5% + VAT</td><td class="num">${peso(m.com+m.vat)}</td></tr><tr><th>Payable to seller</th><th class="num">${peso(m.payable)}</th></tr></table></div>
  <div class="card"><b>History</b><table>${Object.entries(e).sort((a,b)=>a[1].d<b[1].d?-1:1).map(([k,v])=>`<tr><td>${fmt(v.d)}</td><td>${EV[k]}</td><td>${esc(v.by)}</td><td>${chip(v.src)}</td></tr>`).join('')}</table></div></div>`}

function vApprovals(){const P=S.approvals;return `<h2>Approvals</h2><p class="sub">One inbox for rebates, fee waivers, deadline extensions and returns to seller. Approve is a button: the name and time are recorded, never typed.</p>
  <table><tr><th>Type</th><th>Lot</th><th>Detail</th><th>Approver</th><th>Status</th><th></th></tr>
  ${P.map(a=>`<tr><td>${a.type}</td><td>${lotLink(lot(a.lot))}</td><td>${esc(a.detail)}</td><td>${a.role}</td><td><span class="st ${a.status==='approved'?'ok':a.status==='rejected'?'bad':'w'}">${a.status}</span></td>
  <td>${a.status==='pending'&&roleOk('APPROVER')?`<button class="btn" data-act="approve:${a.id}">Approve</button><button class="btn o" data-act="reject:${a.id}">Reject</button>`:''}</td></tr>`).join('')}</table>`}

function vSettlement(){const R=S.lots.filter(l=>l.ev.paid&&!l.ev.seller_paid&&!l.cancel);const by={};R.forEach(l=>(by[l.seller]=by[l.seller]||[]).push(l));
  return `<h2>Seller settlement run</h2><p class="sub">Replaces Payment Seller + print + typed date, and Commission Billing ticks. Paid lots are grouped per seller with every amount computed. One approval pays and bills them all.</p>
  ${Object.keys(by).length?Object.entries(by).map(([s,ls])=>`<div class="card"><b>${s}</b> · ${ls.length} lot(s)<table><tr><th>Lot</th><th>Buyer paid</th><th class="num">Payable to seller</th><th class="num">Commission + VAT</th></tr>
  ${ls.map(l=>`<tr><td>${lotLink(l)}</td><td>${fmt(l.ev.paid.d)}</td><td class="num">${peso(money(l).payable)}</td><td class="num">${peso(money(l).com+money(l).vat)}</td></tr>`).join('')}</table></div>`).join('')+
  (roleOk('FAD')?`<button class="btn" data-act="runApprove">Approve run: pay sellers and bill commission</button>`:'<p class="note">Switch to FAD to approve.</p>'):'<div class="card">No paid lot is waiting for settlement.</div>'}`}

function vPipeline(){const st=S.lots.map(stage);const cnt=k=>st.filter(s=>s.k===k).length;
  const rows=[['kyc','Buyer KYC'],['saaf','Seller approval (SAAF)'],['rebate','Rebate decision'],['pay','Buyer payment'],['after','Paid: settlement / docs / release'],['closed','Closed'],['cancelled','Cancelled']];
  const max=Math.max(...rows.map(r=>cnt(r[0])),1);
  const overdue=S.lots.filter(l=>!l.cancel&&l.ev.baaf&&!l.ev.paid&&S.today>deadline(l)).length;
  const pen=S.lots.reduce((a,l)=>a+penalty(l),0);
  const recv=S.lots.filter(l=>!l.cancel&&l.ev.baaf&&!l.ev.paid).reduce((a,l)=>a+money(l).buyer,0);
  const pay=S.lots.filter(l=>!l.cancel&&l.ev.paid&&!l.ev.seller_paid).reduce((a,l)=>a+money(l).payable,0);
  const done=S.lots.filter(l=>l.ev.release);const avg=done.length?(done.reduce((a,l)=>a+wdBetween(l.ev.sold.d,l.ev.release.d),0)/done.length).toFixed(1):'—';
  return `<h2>Pipeline</h2><p class="sub">Where every unit is, from the same data as My Tasks. Replaces most of the 7 Report screens for day-to-day use.</p>
  <div class="kpis"><div class="kpi"><div class="v">${overdue}</div><div class="l">Unpaid after deadline</div></div>
  <div class="kpi"><div class="v">${peso(pen)}</div><div class="l">Storage penalty accruing</div></div>
  <div class="kpi"><div class="v">${peso(recv)}</div><div class="l">Due from buyers</div></div>
  <div class="kpi"><div class="v">${avg}</div><div class="l">Working days sale → release</div></div></div>
  <div class="card">${rows.map(([k,t])=>`<div class="bar"><span class="lab">${t}</span><span class="b" style="width:${cnt(k)/max*300}px"></span><span class="c">${cnt(k)}</span></div>`).join('')}</div>
  <div class="card">Payable to sellers (paid, not settled): <b>${peso(pay)}</b></div>`}

function vCompare(){const R=[
  ['Result & KYC','Auction › Result Price: switch KYC Pending/Approved by hand','KYC status comes from the buyer’s KYC in the portal','1 switch','0'],
  ['Seller approval (SAAF)','SMD › SAAF: tick For SAAF › Email SAAF; later type Seller Approved date','Sent by the system when KYC is approved; seller clicks Approve in the email','tick + send + typed date','0 (seller clicks)'],
  ['Rebate','Result Price: type rebate › Update; President decides in Approval','Same (already a real approval in V1); BAAF waits for it automatically','2','2'],
  ['Awarding (BAAF)','FAD › Pending Awarding: tick For BAAF, check Awarding Date › Email BAAF','Sent by the system once KYC, SAAF and rebate are clear; Awarding Date = send time','tick + send','0'],
  ['Buyer payment','FAD › Unpaid: type Buyer Paid › Save','Matched from the bank file (or payment module); only mismatches reach FAD','typed date','0 (exceptions only)'],
  ['Unpaid after deadline','Someone notices on Unpaid; cancellation in Result Price','Reminder D-1 automatic; overdue lot appears as a task with Cancel / Extend','find + 4 fields','1 decision'],
  ['Payment to seller','FAD › Payment Seller: tick Print › dialog date › print','Settlement run per seller, one approval','tick + typed date','1 per run'],
  ['Seller acknowledgement','FAD › Seller Acknowledgement: type date','Seller clicks acknowledge in the email','typed date','0 (seller clicks)'],
  ['Commission billing','FAD › Billing: tick Print? › type NOAH no. and date › print','Generated with the settlement run (NOAH integration to be checked)','tick + 2 typed fields','0'],
  ['Dispatch','FAD › Vehicle Dispatch: tick For Dispatch Email? › type Dispatch Date','Notice sent the moment the seller’s condition is met','tick + typed date','0'],
  ['DOAS & documents','FAD › Document Monitoring: tick DOAS email; type up to 5 receipt dates','DOAS email automatic; physical receipts recorded by scanning the transmittal QR','tick + up to 5 typed dates','2 scans'],
  ['Release & penalty','FAD › Unreleased: Record payment of penalty; VWD › Release vehicle','VWD releases; penalty shown and collected in the same step','2 screens','1'],
  ['Approvals (RTS, extension)','Type “SMD/FAD Manager Approved” dates; type approver name','Approve button in one inbox; user and time recorded','typed dates / names','1 click each'],
  ['Where is this unit?','Search up to ~20 lists in FAD, SMD and VWD','One Unit page with timeline, money and history','many screens','1 page']];
  return `<h2>V1 (current prototype) vs V2 (this concept)</h2><p class="sub">Per step of one lot’s life. “Touches” = what a JBAP user does by hand. V2 numbers are design targets that depend on the checks listed in README.md.</p>
  <div class="kpis"><div class="kpi"><div class="v">39 → ~6</div><div class="l">Screens → work areas</div></div><div class="kpi"><div class="v">21 → 0</div><div class="l">Typed date fields (2 become scans)</div></div>
  <div class="kpi"><div class="v">9 → 0</div><div class="l">“For …?” tick columns</div></div><div class="kpi"><div class="v">~15 → ~4</div><div class="l">Touches per normal lot</div></div></div>
  <div class="legend">${Object.keys(SRC).map(chip).join('')}<span class="note">how each date is recorded in V2</span></div>
  <table><tr><th>Step</th><th>V1: how it works</th><th>V2: how it works</th><th>V1 touches</th><th>V2 touches</th></tr>
  ${R.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table>`}

/* ===== Shell ===== */
const ROUTES=[['#/tasks','My Tasks'],['#/approvals','Approvals'],['#/lots','All units'],['#/pipeline','Pipeline'],['#/settlement','Settlement run'],['#/compare','V1 vs V2']];
function go(h){location.hash=h}
function render(){const h=location.hash||'#/tasks';const {T}=tasks();
  const cTask=T.filter(x=>roleOk(x.role)).length,cApp=S.approvals.filter(a=>a.status==='pending').length;
  document.getElementById('today').textContent='Demo date: '+toD(S.today).toDateString();
  document.getElementById('nav').innerHTML=ROUTES.map(([r,t])=>{const n=r==='#/tasks'?cTask:r==='#/approvals'?cApp:null;
    return (r==='#/pipeline'?'<div class="sep">Overview</div>':r==='#/compare'?'<div class="sep">Concept</div>':'')+`<a href="${r}" class="${h.startsWith(r)||(r==='#/lots'&&h.startsWith('#/lot/'))?'on':''}"><span>${t}</span>${n!==null?`<span class="n ${n?'':'z'}">${n}</span>`:''}</a>`}).join('');
  const M=document.getElementById('main');
  M.innerHTML=h.startsWith('#/lot/')?vLot(h.split('/')[2]):h==='#/approvals'?vApprovals():h==='#/lots'?vLots():h==='#/pipeline'?vPipeline():h==='#/settlement'?vSettlement():h==='#/compare'?vCompare():vTasks();
  document.getElementById('feed').innerHTML=S.feed.slice(0,60).map(f=>`<div><span class="d">${fmt(f.d)}</span> ${chip(f.src)} ${esc(f.msg)}</div>`).join('')||'<div class="note">Nothing yet.</div>';
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act],[data-sim]');if(!b)return;
  if(b.dataset.sim){SIM[b.dataset.sim]();}
  else{const a=b.dataset.act;
    if(a.startsWith('approve:'))decide(a.split(':')[1],true);
    else if(a.startsWith('reject:'))decide(a.split(':')[1],false);
    else if(a==='runApprove'){S.lots.filter(l=>l.ev.paid&&!l.ev.seller_paid&&!l.cancel).forEach(l=>{l.ev.seller_paid=E(S.today,'click','FAD Manager')});log('Settlement run approved: sellers paid','click')}
    else ACT[a](lot(b.dataset.lot));}
  runAuto();render();});
document.getElementById('role').addEventListener('change',e=>{ROLE=e.target.value;render()});
window.addEventListener('hashchange',render);
runAuto();render();
</script>
</body>
</html>

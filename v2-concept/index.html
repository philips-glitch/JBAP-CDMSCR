<script>
/* ===== Dates: working days skip Sat/Sun and the holiday list ([MOCK]) ===== */
const HOL=['2026-11-30','2026-12-08','2026-12-24','2026-12-25','2026-12-30','2026-12-31'];
const pad=n=>String(n).padStart(2,'0');
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isWD=d=>d.getDay()%6!==0&&!HOL.includes(iso(d));
const addWD=(s,n)=>{const d=toD(s);while(n>0){d.setDate(d.getDate()+1);if(isWD(d))n--;}return iso(d)};
const wdBetween=(a,b)=>{let n=0;const d=toD(a),e=toD(b);while(d<e){d.setDate(d.getDate()+1);if(isWD(d))n++;}return n};
const calDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const fmt=s=>{if(!s)return '';const[y,m,d]=s.split('-');return `${m}/${d}/${y}`};
const peso=n=>(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,'').trim();
const $=q=>document.querySelector(q);
const CUTOFF='4:00 PM';

/* ===== Icons (copied from V1) ===== */

  VWD:'<path d="M2.5 9.5L12 4l9.5 5.5V21h-19z"/><path d="M6 21v-6.5h12V21"/><path d="M7.6 17.8h8.8M9 14.5l1-1.8h4l1 1.8"/><path d="M8.6 19.6h.1M15.4 19.6h.1"/>',
  APP:'<rect x="5" y="3.5" width="14" height="17.5" rx="1.6"/><path d="M9 3.5V2.5h6v2H9z"/><path d="M8.5 13.2l2.6 2.6 4.6-5.2"/>',
  LOG:'<rect x="4.5" y="3.5" width="13" height="17.5" rx="1.4"/><path d="M8 3.5V2.5h6v2H8z"/><path d="M7.5 9h7M7.5 12.5h4"/><circle cx="17" cy="17" r="4.2"/><path d="M17 15v2.2l1.4 1"/>'};
const deptSvg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DEPT_ICON[d]}</svg>`;

/* ===== Seller parameters (codes as in V1; rules simplified) ===== */
const SELLERS={EWB:{release:'seller_ack',doas:'branch',fee:1000},SBC:{release:'seller_ack',doas:'jbap',fee:400},
  TFS:{release:'buyer_payment',doas:'none',fee:500},ORICO:{release:'doas',doas:'jbap',fee:500}};
const SELLER_CODES=Object.keys(SELLERS);
const RELEASE_TXT={seller_ack:'after Seller Acknowledgement',buyer_payment:'after Buyer Payment',doas:'after Buyer Payment + signed DOAS'};
const SRC={auto:'Auto',click:'1-click',scan:'Scan',manual:'Typed (correction)'};
const EV={sold:'Sold at auction',kyc:'KYC approved',saaf_sent:'SAAF sent to seller',saaf_ok:'Seller signed SAAF',rebate:'Rebate decided',
  baaf:'Awarded (BAAF sent)',paid:'Buyer paid',seller_paid:'Payment to seller',comm_billed:'Commission billed',seller_ack:'Seller acknowledged',
  doas_sent:'DOAS sent for signing',doas_back:'Signed DOAS received',docs_in:'Documents from seller',docs_out:'Documents to buyer',
  dispatch:'Dispatch notice sent',release:'Unit released'};
const ORDER=['sold','kyc','saaf_sent','saaf_ok','rebate','baaf','paid','seller_paid','comm_billed','seller_ack','doas_sent','doas_back','dispatch','release','docs_in','docs_out'];

/* ===== Dummy data (anonymised) ===== */
const BUYER_ACC={D9001:'5800101',D9002:'5800102',D9003:'5800103',D9004:'5800104',D9005:'5800105',D9006:'5800106'};

const BUYERS={D9001:'SAMPLE BUYER A',D9002:'SAMPLE BUYER B',D9003:'SAMPLE BUYER C',D9004:'SAMPLE BUYER D',D9005:'SAMPLE BUYER E',D9006:'SAMPLE BUYER F'};
const E=(d,src='auto',by)=>({d,src,by:by||({auto:'system',click:'user',scan:'fad.user (scan)',manual:'user'})[src]});
function seed(){
  const L=(id,auc,lot,plate,model,seller,buyer,price,ev,x={})=>Object.assign({id,auc,lot,plate,model,seller,buyer,price,ev},x);
  const K=d=>E(d,'auto','buyer portal (KYC)');
  const lots=[
    L('L01',231,101,'XAA1001','TOYOTA VIOS 1.3 E','EWB','D9001',420000,{sold:E('2026-11-02')}),
    L('L02',231,102,'XAA1002','MITSUBISHI MIRAGE G4','SBC','D9002',385000,{sold:E('2026-11-02'),kyc:K('2026-11-02'),saaf_sent:E('2026-11-02')}),
    L('L03',231,103,'XAA1003','TOYOTA INNOVA 2.8 G','TFS','D9003',1120000,{sold:E('2026-11-02'),kyc:K('2026-11-02'),saaf_sent:E('2026-11-02'),saaf_ok:E('2026-11-03','click','smd.user (signed SAAF)')},{rebate:{amt:15000,status:'pending',req:'2026-11-04'}}),
    L('L04',231,104,'XAA1004','HONDA CITY 1.5 S','ORICO','D9001',610000,{sold:E('2026-11-02'),kyc:K('2026-11-02'),saaf_sent:E('2026-11-02'),saaf_ok:E('2026-11-04','click','smd.user (signed SAAF)'),baaf:E('2026-11-04')},{pay:'ok'}),
    L('L05',230,110,'XEW1005','FORD RANGER XLT','EWB','D9004',890000,{sold:E('2026-10-26'),kyc:K('2026-10-26'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-27','click','smd.user (signed SAAF)'),baaf:E('2026-10-28')}),
    L('L06',230,111,'XAA1006','NISSAN ALMERA 1.5','SBC','D9002',455000,{sold:E('2026-10-26'),kyc:K('2026-10-27'),saaf_sent:E('2026-10-27'),saaf_ok:E('2026-10-30','click','smd.user (signed SAAF)'),baaf:E('2026-11-03')},{pay:'short'}),
    L('L07',230,112,'XAA1007','TOYOTA FORTUNER 2.4 G','TFS','D9005',1350000,{sold:E('2026-10-26'),kyc:K('2026-10-26'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-27','click','smd.user (signed SAAF)'),baaf:E('2026-10-28'),paid:E('2026-10-30','auto','system (bank match)'),dispatch:E('2026-10-30')}),
    L('L08',230,113,'XAA1008','SUZUKI ERTIGA GL','ORICO','D9006',640000,{sold:E('2026-10-26'),kyc:K('2026-10-26'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-26','click','smd.user (signed SAAF)'),baaf:E('2026-10-26'),paid:E('2026-10-28','auto','system (bank match)'),doas_sent:E('2026-10-28'),seller_paid:E('2026-11-03','click','fad.manager'),comm_billed:E('2026-11-03')}),
    L('L09',229,120,'XAA1009','HYUNDAI ACCENT 1.6','SBC','D9003',398000,{sold:E('2026-10-19'),kyc:K('2026-10-19'),saaf_sent:E('2026-10-19'),saaf_ok:E('2026-10-20','click','smd.user (signed SAAF)'),baaf:E('2026-10-21'),paid:E('2026-10-26','auto','system (bank match)'),doas_sent:E('2026-10-26'),doas_back:E('2026-10-28','scan'),seller_paid:E('2026-10-28','click','fad.manager'),comm_billed:E('2026-10-28'),seller_ack:E('2026-10-29','click','fad.user'),dispatch:E('2026-10-29'),release:E('2026-11-02','click','vwd.user'),docs_in:E('2026-11-04','scan')}),
    L('L10',229,121,'XAA1010','TOYOTA WIGO 1.0 G','TFS','D9004',345000,{sold:E('2026-10-19'),kyc:K('2026-10-19'),saaf_sent:E('2026-10-19'),saaf_ok:E('2026-10-19','click','smd.user (signed SAAF)'),baaf:E('2026-10-20'),paid:E('2026-10-21','auto','system (bank match)'),dispatch:E('2026-10-21'),seller_paid:E('2026-10-23','click','fad.manager'),comm_billed:E('2026-10-23'),release:E('2026-10-23','click','vwd.user'),seller_ack:E('2026-10-26','click','fad.user'),docs_in:E('2026-10-27','scan'),docs_out:E('2026-10-28','click','fad.user')}),
    L('L11',231,105,'XEW1011','TOYOTA HILUX 2.4 E','EWB','D9006',980000,{sold:E('2026-11-03'),kyc:K('2026-11-05')},{min:1000000}),
    L('L12',230,114,'XEW1012','MITSUBISHI MONTERO GLS','EWB','D9001',1240000,{sold:E('2026-10-26'),kyc:K('2026-10-26'),saaf_sent:E('2026-10-26'),saaf_ok:E('2026-10-28','click','smd.user (signed SAAF)'),baaf:E('2026-10-29'),paid:E('2026-11-04','auto','system (bank match)'),doas_sent:E('2026-11-04')}),
    L('L13',229,122,'XAA1013','ISUZU D-MAX LS','SBC','D9005',760000,{sold:E('2026-10-19'),kyc:K('2026-10-19'),saaf_sent:E('2026-10-19'),saaf_ok:E('2026-10-20','click','smd.user (signed SAAF)'),baaf:E('2026-10-21')},{cancel:{d:'2026-10-28',fee:10000,waived:false,feePaid:null},pay:'fee'}),
    L('L14',231,106,'XAA1014','KIA PICANTO 1.2 EX','ORICO','D9005',330000,{sold:E('2026-11-03'),kyc:K('2026-11-03'),saaf_sent:E('2026-11-03'),saaf_ok:E('2026-11-04','click','smd.user (signed SAAF)'),baaf:E('2026-11-05')},{pay:'ok'})];
  /* SAAF = one printed form per auction per seller (as today); seeded from the lots already sent */
  const saafs=[],g={};lots.filter(l=>l.ev.saaf_sent).forEach(l=>{const k=`${l.auc}|${l.seller}|${l.ev.saaf_sent.d}`;
    if(!g[k]){g[k]={id:saafs.length+1,auc:l.auc,seller:l.seller,lots:[],status:'sent',created:l.ev.saaf_sent.d,checked:l.ev.saaf_sent.d,sent:l.ev.saaf_sent.d};saafs.push(g[k])}g[k].lots.push(l.id)});
  saafs.forEach(f=>{const L=f.lots.map(id=>lots.find(l=>l.id===id));if(L.every(l=>l.ev.saaf_ok)){f.status='signed';f.signed=L.map(l=>l.ev.saaf_ok.d).sort().pop()}});
  /* every bank credit stays on record (Payment › Bank Transfer, unit page, customer page) */
  const payments=lots.filter(l=>l.ev.paid).map((l,i)=>({id:i+1,d:l.ev.paid.d,file:`BANK_${l.ev.paid.d.replace(/-/g,'')}.csv`,lot:l.id,bank:BANKS[i%2],amt:null,kind:'Buyer payment',status:'Matched',by:'system'}));
  const imports=[...new Set(payments.map(p=>p.d))].sort().reverse().map(d=>({d,file:`BANK_${d.replace(/-/g,'')}.csv`,n:payments.filter(p=>p.d===d).length}));
  return {today:'2026-11-06',lots,saafs,payments,paySeq:payments.length+1,exceptions:[],feed:[],imports,outbox:[],obSeq:1,
    approvals:[{id:1,type:'Rebate',lot:'L03',detail:'Rebate 15,000.00 requested by SMD',role:'President',status:'pending',req:'2026-11-04'}],seq:2};
}

const OPEN={Customer:false,Auction:false,Report:false,Approval:false,FAD:true,SMD:false,VWD:false,Payment:false,Master:false};
const lot=id=>S.lots.find(l=>l.id===id);

let toastQ=[];
const USER={SMD:'smd.user',FAD:'fad.user',VWD:'vwd.user',Approval:'president',Auction:'smd.user',Payment:'fad.user'};
function log(msg,src='auto',mod='System',l=null,user){S.feed.unshift({d:S.today,msg,src,mod,rec:l?`${label(l)} · ${l.plate}`:'',user:user||(src==='auto'?'system':USER[mod]||'user')});toastQ.push(msg)}

/* ===== Lot rules ===== */
const deadline=l=>l.ev.baaf?(l.deadlineOverride||addWD(l.ev.baaf.d,3)):null;
const rebateDone=l=>!l.rebate||l.rebate.status!=='pending';
function dispatchReady(l){const s=SELLERS[l.seller];if(!l.ev.paid)return false;
  if(s.release==='buyer_payment')return true;if(s.release==='seller_ack')return !!l.ev.seller_ack;return !!l.ev.doas_back}
const releaseBlock=l=>(SELLERS[l.seller].doas!=='none'&&!l.ev.doas_back)?'Signed DOAS not received yet':null;
const pullDeadline=l=>l.ev.dispatch?addWD(l.ev.dispatch.d,3):null;
function penalty(l){if(!l.ev.dispatch||l.ev.release)return 0;return Math.max(0,calDays(pullDeadline(l),S.today))*500}
const money=l=>{const s=SELLERS[l.seller],com=l.price*.05,vat=com*.12,reb=(l.rebate&&l.rebate.status==='approved')?l.rebate.amt:0;
  return {fee:s.fee,buyer:l.price+s.fee-reb,com,vat,reb,payable:l.price+s.fee-com-vat}};
const closed=l=>l.cancel?(l.cancel.waived||!!l.cancel.feePaid):!!(l.ev.release&&l.ev.docs_out&&l.ev.seller_ack&&l.ev.comm_billed);
function stage(l){
  if(l.cancel)return {k:'cancelled',t:closed(l)?'Cancelled':'Cancelled · fee unpaid',c:closed(l)?'ns':'cx'};
  if(!l.ev.kyc)return {k:'kyc',t:'Waiting KYC',c:'ns'};
  if(!l.ev.saaf_ok)return l.saafDeclined?{k:'saaf',t:'Seller declined (SAAF)',c:'cx'}:{k:'saaf',t:l.ev.saaf_sent?'Waiting signed SAAF':'SAAF to send',c:'ns'};
  if(!l.ev.baaf)return {k:'award',t:rebateDone(l)?'Pending Awarding':'Pending Awarding · rebate',c:'up'};
  if(!l.ev.paid)return S.today>deadline(l)?{k:'pay',t:'Unpaid · overdue',c:'cx'}:{k:'pay',t:'Unpaid',c:'up'};
  if(closed(l))return {k:'closed',t:'Complete',c:'sold'};
  if(l.ev.release)return {k:'after',t:'Released · closing',c:'up'};
  if(l.ev.dispatch)return {k:'after',t:penalty(l)?'For release · overdue':'For release',c:penalty(l)?'cx':'up'};
  return {k:'after',t:'Paid',c:'up'};
}

/* ===== Scheduled emails: built automatically, sent at the daily cut-off unless held ===== */
const KIND={BAAF:{t:'BAAF (awarding)',dept:'FAD',ev:'baaf'},REMIND:{t:'Payment reminder',dept:'SMD',ev:null},
  DOAS:{t:'DOAS for signature',dept:'FAD',ev:'doas_sent'},DISPATCH:{t:'Vehicle dispatch notice',dept:'FAD',ev:'dispatch'}};
const REBATE_HOLD='Rebate waiting for the President';
const ob=(l,k)=>S.outbox.find(o=>o.lot===l.id&&o.kind===k&&o.status!=='dropped');
function schedule(l,kind,held){if(ob(l,kind))return;S.outbox.push({id:S.obSeq++,lot:l.id,kind,status:held?'held':'scheduled',hold:held||null,created:S.today})}
function sendItem(o,how){const l=lot(o.lot),k=KIND[o.kind];o.status='sent';o.sent=S.today;
  if(k.ev)l.ev[k.ev]=E(S.today,how==='now'?'click':'auto',how==='now'?USER[k.dept]:'system');else l.reminded=S.today;
  log(`${k.t} emailed (${how==='now'?'Send now':CUTOFF+' send'})${o.kind==='BAAF'?`; pay by ${fmt(deadline(l))}`:o.kind==='DISPATCH'?`; pull out by ${fmt(addWD(S.today,3))}`:''}`,how==='now'?'click':'auto',k.dept,l)}
function cutoff(){S.outbox.filter(o=>o.status==='scheduled').forEach(o=>sendItem(o,'cutoff'))}
function runAuto(){
  for(const l of S.lots){const e=l.ev,s=SELLERS[l.seller];
    S.outbox.filter(o=>o.lot===l.id&&o.status!=='sent'&&o.status!=='dropped').forEach(o=>{
      if(l.cancel||(o.kind==='REMIND'&&e.paid)){o.status='dropped';return}
      if(o.kind==='BAAF'){if(!rebateDone(l)){o.status='held';o.hold=REBATE_HOLD}else if(o.hold===REBATE_HOLD){o.status='scheduled';o.hold=null}}});
    if(l.cancel)continue;
    if(e.kyc&&!e.saaf_sent&&!saafOf(l))addToSaaf(l);
    if(e.saaf_ok&&!e.baaf)schedule(l,'BAAF',rebateDone(l)?null:REBATE_HOLD);
    if(e.baaf&&!e.paid&&addWD(S.today,1)===deadline(l)&&l.reminded!==S.today)schedule(l,'REMIND');
    if(e.paid&&s.doas!=='none'&&!e.doas_sent)schedule(l,'DOAS');
    if(dispatchReady(l)&&!e.dispatch)schedule(l,'DISPATCH');
    if(e.seller_paid&&!e.comm_billed){e.comm_billed=E(S.today);log(`Commission billing generated for ${l.seller} (settlement run)`,'auto','FAD',l)}}
}

    REMIND:{from:'finance@jbap.com.ph',to:buyerMail,cc:'sales@jbap.com.ph',sub:`JBAP PAYMENT REMINDER - ${b}`,body:`<p>Dear ${b},</p><p>This is a reminder that payment of <b>${peso(m.buyer)}</b> for the unit below is due on <b>${fmt(deadline(l))}</b>. After that date the sale may be cancelled with a cancellation fee of 10,000.00.</p>${unit}`},

  return `<div class="mail"><div class="mail-h"><b>From</b><span>${M.from}</span><b>To</b><span>${M.to}</span><b>Cc</b><span>${M.cc}</span><b>Subject</b><span>${esc(M.sub)}</span></div><div class="mail-b">${M.body}</div></div>`}

const saafOf=l=>S.saafs.find(f=>f.lots.includes(l.id));
const saafName=f=>`A${f.auc} · ${f.seller}`;
const saafLots=f=>f.lots.map(lot);
const minBid=l=>l.min??Math.round(l.price*.97/1000)*1000;
const payRef=l=>`${l.buyer}-A${l.auc}-${l.lot}`;

function addPay(l,amt,kind,status,file,by='system',bank=BANKS[0]){S.payments.push({id:S.paySeq++,d:S.today,file,bank,lot:l.id,amt,kind,status,by})}
const nLots=n=>`${n} lot${n===1?'':'s'}`;
function addToSaaf(l){let f=S.saafs.find(f=>f.auc===l.auc&&f.seller===l.seller&&f.status==='ready');
  if(!f){f={id:S.saafs.length+1,auc:l.auc,seller:l.seller,lots:[],status:'ready',created:S.today};S.saafs.push(f)}f.lots.push(l.id)}
const SAAF_ST={ready:['To check & print','up'],sent:['Waiting signed copy','up'],signed:['Signed','sold']};
const saafActs=f=>f.status==='ready'?(f.checked?[['Reprint','saafPrint','gh',f.id],['Mark sent to seller','saafSent','pr',f.id]]:[['Check & print','saafPrint','pr',f.id]]):f.status==='sent'?[['Print SAAF','saafPrint','gh',f.id],['Record signed SAAF','saafSigned','pr',f.id]]:[['View SAAF','saafPrint','gh',f.id]];

/* ===== Tasks per department (only work that needs a person) ===== */
function tasks(){const T=[],W=[],t=S.today;
  for(const l of S.lots){const e=l.ev,s=SELLERS[l.seller];
    if(l.cancel){if(!closed(l))W.push({dept:'FAD',who:'Buyer',l,txt:`Cancellation fee ${peso(l.cancel.fee)} billed ${fmt(l.cancel.d)}; matched from the bank file when paid`});continue}
    if(!e.kyc){const n=wdBetween(e.sold.d,t);if(n>=2)T.push({dept:'SMD',sev:'med',l,title:'Buyer KYC still missing',m:`${n} working days since the sale; automatic reminders got no response`,due:addWD(e.sold.d,2),acts:[['Remind buyer','remindKyc','ol']]});else W.push({dept:'SMD',who:'Buyer',l,txt:'KYC in the buyer portal'});continue}
    if(!e.saaf_ok){if(l.saafDeclined)T.push({dept:'SMD',sev:'high',l,title:`${l.seller} did not sign for this lot on the SAAF`,m:`Recorded ${fmt(l.saafDeclined)}. Cancel the sale, or record the approval if the seller agrees later`,due:null,acts:[['Cancel sale','cancel','dg'],['Record approval','saafManual','gh']]});
      else if(e.saaf_sent)W.push({dept:'SMD',who:l.seller,l,saaf:1,txt:`Signed SAAF ${saafName(saafOf(l))} (SMD records it when the form comes back)`});continue}
    if(!e.baaf){if(!rebateDone(l))W.push({dept:'FAD',who:'President',l,txt:'Rebate decision; the BAAF is held until then'});else W.push({dept:'FAD',who:'Scheduled send',l,txt:`BAAF goes out at the ${CUTOFF} send`});continue}
    if(!e.paid){const dl=deadline(l);if(t>dl)T.push({dept:'SMD',sev:'high',l,title:'Unpaid after the deadline',m:`Deadline ${fmt(dl)}; the reminder was sent automatically`,due:dl,acts:[['Cancel sale','cancel','dg'],['Request +2 days','extend','ol']]});else W.push({dept:'SMD',who:'Buyer',l,txt:`Payment, deadline ${fmt(dl)}`});continue}
    if(e.seller_paid&&!e.seller_ack)W.push({dept:'FAD',who:l.seller,l,txt:'Signed acknowledgement of payment (FAD records it when it comes back)'});
    if(e.doas_sent&&!e.doas_back){if(s.doas==='jbap')T.push({dept:'FAD',sev:'low',l,title:'Signed DOAS: scan on receipt',m:`DOAS emailed ${fmt(e.doas_sent.d)}; scanning the transmittal QR records the date`,due:null,acts:[['Scan signed DOAS','scanDoas','pr']]});
      else T.push({dept:'FAD',sev:'low',l,title:'DOAS signed at the EWB branch: record on confirmation',m:`Signing notice emailed ${fmt(e.doas_sent.d)}; record it when EWB confirms (email or the signed copy)`,due:null,acts:[['Record signed DOAS','doasBranch','pr']]})}
    if(e.seller_paid&&(s.doas==='none'||e.doas_back)&&!e.docs_in)T.push({dept:'FAD',sev:'low',l,title:'Documents from seller: scan on receipt',m:'ORCR / deed package from the seller',due:null,acts:[['Scan documents','scanDocs','pr']]});
    if(e.dispatch&&!e.release){const p=penalty(l),b=releaseBlock(l);T.push({dept:'VWD',sev:p?'high':'med',l,title:p?`Overdue for pull-out · penalty ${peso(p)}`:'Ready for pull-out',m:b?`Blocked: ${b}`:`Pull-out deadline ${fmt(pullDeadline(l))}`,due:pullDeadline(l),acts:[['Release vehicle','release','pr']]})}
    else if(!e.dispatch)W.push({dept:'VWD',who:s.release==='seller_ack'?l.seller:'Buyer',l,txt:`Dispatch ${RELEASE_TXT[s.release]}`});
    if(e.docs_in&&e.release&&!e.docs_out)T.push({dept:'FAD',sev:'low',l,title:'Hand documents to buyer',m:'Unit released; documents are in',due:null,acts:[['Mark handed over','docsOut','pr']]});
  }
  for(const f of S.saafs){const n=f.lots.length,lt=`${n} lot${n>1?'s':''}`;
    if(f.status==='ready')T.push({dept:'SMD',sev:'med',l:null,sf:f,title:f.checked?`SAAF ${saafName(f)} checked: get signatures and send (${lt})`:`SAAF ${saafName(f)} ready to check & print (${lt})`,m:f.checked?`Checked ${fmt(f.checked)}. After the Sales & Marketing Head and Finance & Admin Head sign, send it and click Mark sent`:'Built from the lots with KYC approved. Check the winning bid price and buyer of each lot, then print',due:null,acts:saafActs(f)});
    if(f.status==='sent'){const d=wdBetween(f.sent,t);if(d>=2)T.push({dept:'SMD',sev:'med',l:null,sf:f,title:`Signed SAAF ${saafName(f)} not back yet (${lt})`,m:`Sent ${fmt(f.sent)}, ${d} working days ago`,due:addWD(f.sent,2),acts:[['Remind seller','saafNudge','ol',f.id],['Record signed SAAF','saafSigned','pr',f.id]]})}}
  const ack={};S.lots.filter(l=>l.ev.seller_paid&&!l.ev.seller_ack&&!l.cancel).forEach(l=>(ack[l.seller]=ack[l.seller]||[]).push(l));
  for(const[sl,ls] of Object.entries(ack))T.push({dept:'FAD',sev:'low',l:null,sf:{seller:sl},title:`${sl}: acknowledgement of payment not recorded (${ls.length} lot${ls.length>1?'s':''})`,m:'Record it when the seller’s signed acknowledgement comes back',due:null,acts:[['Record acknowledgement','ackRecord','pr',sl]]});
  const run=runLots();
  if(run.length)T.push({dept:'FAD',sev:'med',l:null,title:'Seller settlement run is ready',m:`${run.length} paid lot(s); payable and commission already computed`,due:null,acts:[['Open settlement run','gorun','pr']]});
  for(const x of S.exceptions){const l=lot(x.lot);T.unshift({dept:'FAD',sev:'high',l,title:'Bank payment does not match',m:`Received ${peso(x.amt)}; expected ${peso(money(l).buyer)}`,due:null,acts:[['Accept & match','match','pr'],['Ask buyer for balance','short','ol']]})}
  return {T,W};
}

function decide(id,ok){const a=S.approvals.find(a=>a.id===+id),l=lot(a.lot);
  const apply=reason=>{a.status=ok?'approved':'rejected';a.at=S.today;a.reason=reason;
    if(a.type==='Rebate'){l.rebate.status=a.status;l.ev.rebate=E(S.today,'click','president')}
    if(a.type==='Payment deadline extension'&&ok)l.deadlineOverride=addWD(deadline(l),2);
    if(a.type==='Fee waiver'&&ok){l.cancel.waived=true;l.cancel.fee=0}
    log(`${a.type} ${a.status}${reason?`. Reason: ${reason}`:''}`,'click','Approval',l,a.role==='President'?'president':'fad.manager')};
  if(ok){apply(null);return}
  modal(`Reject ${a.type.toLowerCase()}`,`<p>${label(l)} · ${l.plate} · ${esc(a.detail)}</p><div class="fld w3"><span class="lbl">Reason (required)</span><input class="ctl" id="rr"></div>`,
    ()=>{const r=$('#rr').value.trim();if(!r)return err('Reason is required.');apply(r)},'Reject','dg')}
const SIM={
  bank:(bank=BANKS[0])=>{const file=`BANK_${S.today.replace(/-/g,'')}${S.imports.some(i=>i.d===S.today)?'_2':''}.csv`,before=S.payments.length,pay=(l,a,k,st,f)=>addPay(l,a,k,st,f,'system',bank);for(const l of S.lots){
      if(l.cancel&&l.pay==='fee'&&!l.cancel.feePaid&&!l.cancel.waived){l.cancel.feePaid=S.today;pay(l,10000,'Cancellation fee','Matched',file);log('Cancellation fee matched from the bank file','auto','Payment',l);continue}
      if(l.cancel||!l.ev.baaf||l.ev.paid)continue;
      if(l.pay==='ok'){l.ev.paid=E(S.today,'auto','system (bank match)');pay(l,money(l).buyer,'Buyer payment','Matched',file);log('Buyer payment matched from the bank file','auto','Payment',l)}
      else if(l.pay==='bal'){l.ev.paid=E(S.today,'auto','system (bank match)');pay(l,5000,'Balance','Matched: balance completes the payment',file);log('Balance 5,000.00 matched; lot is paid','auto','Payment',l)}
      else if(l.pay==='short'&&!S.exceptions.some(x=>x.lot===l.id)){const a=money(l).buyer-5000;S.exceptions.push({lot:l.id,amt:a});pay(l,a,'Buyer payment','Short by 5,000.00: in FAD › My Tasks',file);log('Payment short by 5,000.00; sent to FAD › My Tasks','auto','Payment',l)}}
    const n=S.payments.length-before;S.imports.unshift({d:S.today,file,n,bank});if(!n)log('Bank file imported: nothing new to match','auto','Payment')},
  seller:()=>{const f=S.saafs.find(f=>f.status==='sent');if(!f)return log('No SAAF is out with a seller. Mark one as sent first (SMD › SAAF).');
    saafLots(f).filter(l=>!l.ev.saaf_ok&&!l.cancel).forEach(l=>{l.ev.saaf_ok=E(S.today,'click','smd.user (signed SAAF)')});f.status='signed';f.signed=S.today;
    log(`Signed SAAF ${saafName(f)} came back; SMD recorded it (all lots signed)`,'click','SMD')},
  kyc:()=>{const l=S.lots.find(l=>!l.ev.kyc);if(!l)return log('No buyer is waiting for KYC');l.ev.kyc=E(S.today,'auto','buyer portal (KYC)');log('Buyer finished KYC in the buyer portal','auto','Customer',l)},
  cutoff:()=>{const n=S.outbox.filter(o=>o.status==='scheduled').length;cutoff();if(!n)log(`${CUTOFF} send: nothing scheduled`)},
  day:()=>{cutoff();S.today=addWD(S.today,1);log(`New working day: ${fmt(S.today)}`)},
  reset:()=>{S=seed();for(const k in UI)delete UI[k];runAuto();S.feed=[];toastQ=[]}
};

/* ===== Lists: the V1 pattern (Filter card, Show entries, sortable headers, paging) ===== */
const UI={};
const U=id=>UI[id]||(UI[id]={f:{},sort:null,dir:1,page:0,size:10});
function listCard({id,title,cols,rows,filters=[],tb='',none=['No records','']}){const u=U(id);
  let R=rows.filter(r=>filters.every(f=>{const v=u.f[f.key];if(!v)return true;const x=strip(f.get(r));return f.type==='select'?x===v:x.toLowerCase().includes(v.toLowerCase())}));
  if(u.sort!=null&&cols[u.sort]){const c=cols[u.sort],g=c.sv||(r=>strip(c.r(r)));R=[...R].sort((a,b)=>{const x=g(a),y=g(b);return (x>y?1:x<y?-1:0)*u.dir})}
  const n=R.length,pages=Math.max(1,Math.ceil(n/u.size));if(u.page>=pages)u.page=pages-1;if(u.page<0)u.page=0;const P=R.slice(u.page*u.size,(u.page+1)*u.size);
  const fc=filters.length?`<section class="card filter" aria-label="Filter"><div class="card-h"><div class="ico">${IC.filter}</div>Filter</div><form class="fb" data-lform="${id}">${filters.map(f=>`<div class="fld"><label>${f.label}</label>${f.type==='select'?`<select class="ctl" name="${f.key}"><option value="">All</option>${f.options.map(o=>`<option ${u.f[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="ctl" name="${f.key}" placeholder="Type to search" value="${esc(u.f[f.key]||'')}">`}</div>`).join('')}
    <div class="btns"><button type="button" class="btn gh" data-lreset="${id}">${IC.reset}Reset</button><button type="submit" class="btn pr">${IC.search}Apply filter</button></div></form></section>`:'';
  const head=`<thead><tr>${cols.map((c,i)=>`<th ${u.sort===i?`aria-sort="${u.dir>0?'ascending':'descending'}"`:''}>${c.nosort?`<span class="hb">${c.h}</span>`:`<button type="button" class="hb" data-lsort="${id}:${i}">${c.h}<span class="si"></span></button>`}</th>`).join('')}</tr></thead>`;
  const body=P.length?`<div class="tw"><table>${head}<tbody>${P.map(r=>`<tr>${cols.map(c=>`<td class="${c.cls||''}">${c.r(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${IC.inbox}<b>${none[0]}</b>${none[1]}</div>`;
  const pg=`<div class="pg"><span>Showing ${n?u.page*u.size+1:0} to ${Math.min(n,(u.page+1)*u.size)} of ${n} entries</span><div class="pgr"><button type="button" class="pb" data-lpage="${id}:${u.page-1}" ${u.page?'':'disabled'}>Previous</button>${Array.from({length:pages},(_,i)=>`<button type="button" class="pb ${i===u.page?'is-active':''}" data-lpage="${id}:${i}">${i+1}</button>`).join('')}<button type="button" class="pb" data-lpage="${id}:${u.page+1}" ${u.page<pages-1?'':'disabled'}>Next</button></div></div>`;
  return fc+`<section class="card"><div class="card-h"><div class="ico">${IC.table}</div>${title}<span class="bdg">${n}</span></div><div class="tb"><span>Show<select data-lsize="${id}">${[10,15,25,50].map(s=>`<option ${s===u.size?'selected':''}>${s}</option>`).join('')}</select>entries</span>${tb}</div>${body}${pg}</section>`}
const C=(h,r,o={})=>Object.assign({h,r},o);
const lotOf=r=>('l' in r)?(r.l||r.sf||null):(typeof r.lot==='string'?lot(r.lot):r);
const F={auc:{key:'auc',label:'Auction No.',get:r=>lotOf(r)?.auc},seller:{key:'seller',label:'Seller',type:'select',options:SELLER_CODES,get:r=>lotOf(r)?.seller},
  plate:{key:'plate',label:'Plate Number',get:r=>lotOf(r)?.plate},cust:{key:'cust',label:'Customer Name / Buyer ID',get:r=>{const l=lotOf(r);return l&&l.buyer?`${BUYERS[l.buyer]} ${l.buyer}`:''}}};

/* ===== UI helpers ===== */
const chip=src=>`<span class="src ${src}">${SRC[src]}</span>`;

const head=(crumbs,title,rule,acts=['View','Filter','Sort'])=>`<nav class="crumb" aria-label="Breadcrumb"><a href="#/">Home</a>›${crumbs.map(c=>Array.isArray(c)?`<a href="${c[1]}">${c[0]}</a>›`:`<span>${c}</span>›`).join('')}<b>${esc(title)}</b></nav>

  <p class="rule">${IC.info}<span>${rule}</span></p>`;
const card=(title,n,body)=>`<section class="card"><div class="card-h"><div class="ico">${IC.table}</div>${title}${n!=null?`<span class="bdg">${n}</span>`:''}</div>${body}</section>`;
const btn=(t,act,cls,lid,extra='')=>`<button type="button" class="btn ${cls}" data-act="${act}" ${lid?`data-lot="${lid}"`:''} ${extra}>${t}</button>`;
const idCols=()=>[C('Auction No.',r=>lotOf(r)?.auc??'',{cls:'c'}),C('Lot',r=>lotOf(r)?.lot??'',{cls:'c'}),C('Plate Number',r=>unitLink(lotOf(r))),C('Customer Name',r=>custLink(lotOf(r))),C('Seller',r=>lotOf(r)?.seller??'',{cls:'c'})];

  VWD:'One list instead of VWD Unreleased Unit, Unreleased Unit (Overdue) and For Dispatch. A unit appears once the seller’s release condition is met; Release vehicle also collects the storage penalty.'};

  const ww=W.filter(w=>w.dept===dept),obx=S.outbox.filter(x=>KIND[x.kind].dept===dept&&(x.status==='scheduled'||x.status==='held'));
  const base=`#/${dept}/my-tasks`,tabs=`<nav class="tabs" aria-label="My Tasks tabs">${[['','Tasks',mine.length],['/scheduled','Scheduled emails',obx.length],['/waiting','Waiting on others',ww.length]].filter(t=>dept!=='VWD'||t[0]!=='/scheduled').map(([h,t,n])=>`<a class="tab ${(tab||'')===h.slice(1)?'is-active':''}" href="${base}${h}">${t}<span class="cnt ${n&&h===''?'warn':''}">${n}</span></a>`).join('')}</nav>`;

      C('Action',x=>btn('Preview','obPreview','ol',x.lot,`data-arg="${x.id}"`)+' '+(x.status==='scheduled'?btn('Hold','obHold','gh',x.lot,`data-arg="${x.id}"`):x.hold!==REBATE_HOLD?btn('Release hold','obRelease','gh',x.lot,`data-arg="${x.id}"`):''),{nosort:1})],
    none:['Nothing scheduled','Emails appear here as soon as CDMS prepares them.']});
  else if(tab==='waiting')body=listCard({id:dept+'-wait',title:'Waiting on buyer, seller, approver or the scheduled send',rows:ww,filters:[F.auc,F.seller,F.cust],

  else body=listCard({id:dept+'-tasks',title:'Tasks',rows:mine,filters:[F.auc,F.seller,F.cust],
    cols:[C('',x=>`<span class="prio ${x.sev}"></span>`,{cls:'c',sv:x=>o[x.sev]}),C('Task',x=>`<b>${esc(x.title)}</b><br><span class="note" style="padding:0">${esc(x.m)}</span>`,{cls:'wrapcell'}),...idCols(),
      C('Due',x=>`<span class="${x.due&&x.due<S.today?'late':''}">${fmt(x.due)}</span>`,{cls:'c',sv:x=>x.due||'9'}),C('Action',x=>x.acts.map(([t,a,c,g])=>btn(t,a,c,x.l?.id,g!=null?`data-arg="${g}"`:'')).join(' '),{nosort:1})],
    none:['Nothing needs you right now','Everything else moves by itself. See the other tabs.']});
  return head([dept],'My Tasks',DEPT_RULE[dept],['View','Filter','Sort','Update'])+tabs+body}

function vPipeline(){const st=S.lots.map(stage),cnt=k=>st.filter(s=>s.k===k).length;
  const rows=[['kyc','Waiting KYC'],['saaf','SAAF (to send / waiting signed copy)'],['award','Pending Awarding'],['pay','Unpaid'],['after','Paid: settlement / documents / release'],['closed','Complete'],['cancelled','Cancelled']];
  const max=Math.max(...rows.map(r=>cnt(r[0])),1);
  const overdue=S.lots.filter(l=>!l.cancel&&l.ev.baaf&&!l.ev.paid&&S.today>deadline(l)).length,pen=S.lots.reduce((a,l)=>a+penalty(l),0);
  const recv=S.lots.filter(l=>!l.cancel&&l.ev.baaf&&!l.ev.paid).reduce((a,l)=>a+money(l).buyer,0);
  const done=S.lots.filter(l=>l.ev.release),avg=done.length?(done.reduce((a,l)=>a+wdBetween(l.ev.sold.d,l.ev.release.d),0)/done.length).toFixed(1):'—';
  return head(['Report'],'Pipeline','Every unit after the auction, by stage, from the same data as My Tasks. Click a plate to open the unit. The formal reports JBAP sends out (Rebate Monitoring, Liability to Seller, Inventory Summary, Cancellation Monitoring) stay as in V1.')+
  `<div class="kpis v2"><div class="kpi"><div class="k">Unpaid after deadline</div><div class="v">${overdue}</div></div><div class="kpi"><div class="k">Storage penalty accruing</div><div class="v">${peso(pen)}</div></div>
  <div class="kpi"><div class="k">Due from buyers</div><div class="v">${peso(recv)}</div></div><div class="kpi"><div class="k">Working days sale → release</div><div class="v">${avg}</div></div></div>`+
  card('Units by stage',null,`<div class="bars">${rows.map(([k,t])=>`<div class="bar"><span class="lab">${t}</span><span class="b" style="width:${cnt(k)/max*320}px"></span><span>${cnt(k)}</span></div>`).join('')}</div>`)+
  listCard({id:'pipe',title:'All units',rows:S.lots,filters:[F.auc,F.seller,F.cust,{key:'stage',label:'Stage',type:'select',options:[...new Set(S.lots.map(l=>stage(l).t))],get:l=>stage(l).t}],
    cols:[...idCols(),C('Make/Model',l=>esc(l.model)),C('Stage',l=>stHtml(l))]})}

function vUnit(id){const l=lot(id);if(!l)return `<div class="empty">${IC.inbox}<b>Unit not found</b></div>`;const s=SELLERS[l.seller],m=money(l),e=l.ev;
  const {T,W}=tasks(),my=T.filter(t=>t.l&&t.l.id===id),wt=W.filter(w=>w.l.id===id&&w.who!=='Scheduled send'&&!w.saaf),sf=saafOf(l),obx=S.outbox.filter(o=>o.lot===id&&(o.status==='scheduled'||o.status==='held'));
  const main=['sold','kyc','saaf_sent','saaf_ok'].concat(l.rebate?['rebate']:[]).concat(['baaf','paid']),fm=main.find(k=>!e[k]);
  const box=(k,cur)=>{const x=e[k];return `<div class="step ${x?'done':cur?'cur':''}"><div class="h">${EV[k]}</div><div class="d">${x?`${fmt(x.d)} · ${esc(x.by)} ${chip(x.src)}`:cur?'next':'—'}</div></div>`};

  return head(['Unit'],`${label(l)} · ${l.plate}`,`${esc(l.model)} · Seller ${l.seller} (dispatch ${RELEASE_TXT[s.release]}; DOAS ${s.doas==='none'?'not used':s.doas==='branch'?'signed at the seller’s branch':'signed at JBAP'}) · Buyer ${custLink(l)} (${l.buyer}) · ${stHtml(l)}. One page for every department; in V1 this lot sits in up to 9 lists.`,['View','Update'])+
  `<section class="card"><div class="card-h"><div class="ico">${IC.task}</div>Next action</div><div class="nextbox">
   ${my.map(x=>`<div class="row"><span class="prio ${x.sev}"></span><b>${esc(x.title)}</b> <span class="st up">${x.dept}</span> <span class="note" style="padding:0">${esc(x.m)}</span> ${x.acts.map(([t,a,c])=>btn(t,a,c,id)).join(' ')}</div>`).join('')}
   ${sf&&!e.saaf_ok&&!l.cancel&&sf.status!=='signed'?`<div class="row"><span class="prio med"></span><b>SAAF ${saafName(sf)}</b> (${sf.lots.length} lot${sf.lots.length>1?'s':''}): <span class="st up">${SAAF_ST[sf.status][0]}</span> <span class="st up">SMD</span> ${saafActs(sf).map(([t,a,c,g])=>btn(t,a,c,'',`data-arg="${g}"`)).join(' ')}</div>`:''}
   ${obx.map(o=>`<div class="row">${IC.mail} ${KIND[o.kind].t}: <span class="st ${o.status==='held'?'cx':'up'}">${o.status==='held'?'Held':'Scheduled '+CUTOFF}</span>${o.hold?` <span class="note" style="padding:0">${esc(o.hold)}</span>`:''} ${btn('Preview','obPreview','ol',id,`data-arg="${o.id}"`)}</div>`).join('')}
   ${wt.map(w=>`<div class="row">Waiting on <b>${esc(w.who)}</b>: ${esc(w.txt)}</div>`).join('')}
   ${!my.length&&!wt.length&&!obx.length&&!(sf&&!e.saaf_ok&&sf.status!=='signed')?`<div class="row">${closed(l)?'Complete. Nothing left to do.':'No action needed: CDMS handles the next step.'}</div>`:''}
   <div class="row">${!e.baaf&&!l.rebate&&!l.cancel&&e.saaf_ok?btn('Request rebate','rebate','ol',id):''}${!e.release&&!l.cancel?btn('Cancel sale','cancel','gh',id):''}</div></div></section>`+
  (l.cancel?card('Cancellation',null,`<div class="nextbox">Cancelled ${fmt(l.cancel.d)} · fee ${peso(l.cancel.fee)}${l.cancel.waived?' (waived)':''} · ${l.cancel.feePaid?'fee paid '+fmt(l.cancel.feePaid):l.cancel.waived?'':'fee unpaid'}</div>`):'')+
  card('Sale → payment',null,`<div class="steps">${main.map(k=>box(k,k===fm&&!l.cancel)).join('')}</div>${e.baaf&&!e.paid&&!l.cancel?`<p class="note">Payment deadline ${fmt(deadline(l))}${l.deadlineOverride?' (extended)':''}</p>`:''}`)+
  card('After payment: three tracks in parallel',null,`<div class="tracks">${trk('Seller settlement',['seller_paid','comm_billed','seller_ack'])}${trk('Documents',docKeys)}${trk('Release',['dispatch','release'])}</div>
   ${e.dispatch&&!e.release?`<p class="note">Pull-out deadline ${fmt(pullDeadline(l))} · storage penalty now <span class="${penalty(l)?'late':''}">${peso(penalty(l))}</span></p>`:''}${l.penaltyPaid?`<p class="note">Penalty collected ${peso(l.penaltyPaid)}</p>`:''}`)+
  `<div class="two">`+card('Money',null,`<div style="padding:8px 16px 12px"><table class="kv"><tbody>
   <tr><td>Awarded Price</td><td>${peso(l.price)}</td></tr><tr><td>Transfer / Notarial Fee</td><td>${peso(m.fee)}</td></tr>${m.reb?`<tr><td>Rebate (approved)</td><td>−${peso(m.reb)}</td></tr>`:''}
   <tr><td><b>Buyer pays</b></td><td><b>${peso(m.buyer)}</b></td></tr>${S.payments.filter(p=>p.lot===id).map(p=>`<tr><td>Received ${fmt(p.d)} · ${esc(p.kind)} · <a class="blink" href="#/Payment/bank-transfer">${p.file}</a><br><span class="note" style="padding:0">${esc(p.status)}</span></td><td>${peso(payAmt(p))}</td></tr>`).join('')}<tr><td>Commission 5% + VAT (illustrative)</td><td>${peso(m.com+m.vat)}</td></tr><tr><td><b>Payable to Seller</b></td><td><b>${peso(m.payable)}</b></td></tr></tbody></table></div>`)+

  ['Rebate','Result Price: type rebate › Update; President decides in Approval','Same, in one Approval inbox; the scheduled BAAF is held automatically until the decision','2','2'],
  ['Awarding (BAAF)','FAD › Pending Awarding: tick For BAAF, check Awarding Date › Email BAAF','Prepared when KYC, SAAF and rebate are clear; sent at the '+CUTOFF+' send (Preview / Hold / Send now); Awarding Date = send date','tick + send','0 (optional hold)'],
  ['Buyer payment','FAD › Unpaid: type Buyer Paid › Save','Payment › Bank Transfer: same import and template as CDMS today; CDMS assigns each credit by Customer Account Number + Amount (today FAD assigns every line by hand); only mismatches reach FAD › My Tasks','typed date','0 (exceptions only)'],
  ['Unpaid after deadline','Someone notices on Unpaid; cancel in Result Price','Reminder before the deadline is automatic; overdue lot is an SMD task with Cancel / Extend','find + dialog','1 decision'],
  ['Payment to seller','FAD › Payment Seller: tick Print › type date › print','FAD › Settlement Run: one approval per run','tick + typed date','1 per run'],
  ['Seller acknowledgement','FAD › Seller Acknowledgement: type date per lot','FAD › My Tasks: Record acknowledgement per seller (ticks the lots on the signed copy); date and user recorded','typed date per lot','1 per seller'],
  ['Commission billing','FAD › Billing: tick Print? › type NOAH no. and date › print','Generated with the settlement run (NOAH integration to check)','tick + 2 typed fields','0'],
  ['Dispatch','FAD › Vehicle Dispatch: tick For Dispatch Email? › type Dispatch Date','Notice prepared when the seller’s release condition is met; sent at the '+CUTOFF+' send','tick + typed date','0'],
  ['DOAS & documents','FAD › Document Monitoring: tick DOAS email; type up to 5 receipt dates','FAD › Documents: DOAS email prepared automatically; physical receipts by scanning the transmittal QR','tick + up to 5 dates','2 scans'],
  ['Release & penalty','FAD › Unreleased: Record payment; then VWD › Release vehicle','VWD › My Tasks › Release vehicle collects the penalty in the same step','2 screens','1'],
  ['Approvals (RTS, extension)','Typed “SMD/FAD Manager Approved” dates; typed approver name','Approve button in Approval › Approvals; user and time recorded','typed dates / names','1 click each'],
  ['Correcting a date','Change date with a reason (Document Monitoring only)','Change date with a reason on every unit (kept from V1)','—','only when needed'],
  ['Where is this unit?','Look through up to ~9 lists in FAD, SMD and VWD','One unit page: next action, timeline, money, history','several screens','1 page']];
  return head(['Concept'],'V1 vs V2','Per step of one lot’s life. “Touches” = what a JBAP user does by hand. V2 numbers are design targets that depend on the checks in v2-concept/README.md.')+
  `<div class="kpis v2"><div class="kpi"><div class="k">Screens</div><div class="v">39 → 21</div><div class="s">14 new or changed + 7 kept as V1</div></div><div class="kpi"><div class="k">Typed date fields, normal flow</div><div class="v">21 → 0</div><div class="s">Change date stays for corrections</div></div>
  <div class="kpi"><div class="k">“For …?” tick columns</div><div class="v">9 → 0</div><div class="s">Scheduled send with Hold</div></div><div class="kpi"><div class="k">Touches per normal lot</div><div class="v">±15–20 → ±4–6</div><div class="s">design target</div></div></div>`+
  card('Step by step',R.length,`<div class="tb">${Object.keys(SRC).map(k=>chip(k)).join(' ')}<span>how each date is recorded in V2</span></div><div class="tw"><table><thead><tr>${['Step','V1 (current prototype)','V2 (this concept)','V1 touches','V2 touches'].map(h=>`<th><span class="hb">${h}</span></th>`).join('')}</tr></thead><tbody>
  ${R.map(r=>`<tr><td class="wrapcell" style="min-width:140px"><b>${r[0]}</b></td><td class="wrapcell">${r[1]}</td><td class="wrapcell">${r[2]}</td><td class="wrapcell" style="min-width:110px">${r[3]}</td><td class="wrapcell" style="min-width:110px">${r[4]}</td></tr>`).join('')}</tbody></table></div><div class="pg"></div>`)}

/* ===== Menu (CDMS sidebar; FAD/SMD/VWD kept, contents reduced) ===== */
const MENU=[['Dashboard','dashboard'],['Customer','customer',[['Customer Inquiry','Customer/customer-inquiry']]],['Seller Inquiry','seller-inquiry'],['Cars','cars'],['Master','master',[['Holiday List (as V1)',null]]],
  ['Auction','auction',[['Result Price','Auction/result-price',null,1]]],['Live Auction','live-auction'],['Live Result','live-result'],['Market Search','market-search'],
  ['Report','report',[['Pipeline','Report/pipeline',null,1],['Rebate Monitoring (as V1)',null],['Liability to Seller (as V1)',null],['Inventory Summary (as V1)',null],['Cancellation Monitoring (as V1)',null]]],
  ['Approval','APP',[['Approvals','Approval/approvals',()=>pendingApprovals().length,1]]],
  ['FAD','FAD',[['My Tasks','FAD/my-tasks',()=>tasks().T.filter(t=>t.dept==='FAD').length,1],['Settlement Run','FAD/settlement-run',()=>runLots().length,1],['Documents','FAD/documents',null,1],['Security Bond (as V1)',null]]],
  ['SMD','SMD',[['My Tasks','SMD/my-tasks',()=>tasks().T.filter(t=>t.dept==='SMD').length,1],['SAAF','SMD/saaf',()=>S.saafs.filter(f=>f.status!=='signed').length,1],['Return to Seller (as V1, approvals in inbox)',null]]],
  ['VWD','VWD',[['My Tasks','VWD/my-tasks',()=>tasks().T.filter(t=>t.dept==='VWD').length,1]]],
  ['Sales Summary','sales-summary'],['Cashier Closing','cashier-closing'],['Deposit','deposit'],['Payment','payment',[['Bank Transfer','Payment/bank-transfer',null,1]]],['Inspection','inspection'],['Staff','staff'],['Log Activity','LOG',null]];
function renderMenu(route){$('#menu').innerHTML=MENU.map(([t,ic,items])=>{const icon=DEPT_ICON[ic]?deptSvg(ic):`<img src="../assets/ic-${ic}.png" alt="">`;
    if(t==='Log Activity')return `<a class="mi ${route==='log'?'is-active':''}" href="#/log">${icon}Log Activity</a>`;
    if(!items)return `<button type="button" class="mi is-disabled" aria-disabled="true" data-disabled="${t}">${icon}${t}</button>`;
    const open=!!OPEN[t];
    return `<button type="button" class="mi" data-group="${t}" aria-expanded="${open}">${icon}${t}<span class="caret"></span></button><div class="lvs" ${open?'':'hidden'}>${items.map(([n,h,c,isV2])=>h?`<a class="mis ${route.startsWith(h)?'is-active':''}" href="#/${h}">${n}${isV2?'<span class="v2tag">V2</span>':''}${c?`<span class="cnt">${c()}</span>`:''}</a>`:`<button type="button" class="mis is-disabled" aria-disabled="true" data-disabled="${n}">${n}</button>`).join('')}</div>`}).join('')+
  '<p class="side-note">V2 concept: green V2 tags mark new or changed screens. Items marked “as V1” keep the V1 prototype design. Other menus are existing CDMS and not part of this concept.</p>'}

/* ===== Sidebar open/close: desktop collapses, narrow screens use an overlay with a backdrop ===== */
const narrow=()=>window.matchMedia('(max-width:1100px)').matches;
function setCollapsed(v){document.body.classList.toggle('nav-collapsed',v);try{localStorage.setItem('v2navCollapsed',v?'1':'0')}catch(e){}}
function closeNav(){document.body.classList.remove('nav-open')}
try{if(localStorage.getItem('v2navCollapsed')==='1')document.body.classList.add('nav-collapsed')}catch(e){}

/* ===== Modal, toasts, render ===== */
let modalOk=null;
function err(m){const b=$('#modal .modal-b');let e=b.querySelector('.msg.error');if(!e){e=document.createElement('div');e.className='msg error';e.style.margin='0 0 10px';b.prepend(e)}e.textContent=m;return false}
function modal(title,body,ok,okText,okCls){modalOk=ok||null;$('#modal').innerHTML=`<div class="modal-bg" data-bg><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h">${title}<button type="button" class="x" data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div>
  <div class="modal-f"><button type="button" class="btn gh" data-close>${ok?'Cancel':'Close'}</button>${ok?`<button type="button" class="btn ${okCls||'pr'}" data-ok>${okText||'OK'}</button>`:''}</div></div></div>`;
  setTimeout(()=>{const f=$('#modal input:not([readonly]):not([type=checkbox])');(f||$('#modal [data-ok]')||$('#modal [data-close]'))?.focus()},0)}
const closeModal=()=>{$('#modal').innerHTML='';modalOk=null};
function demoModal(){modal('Demo events',`<p class="note" style="padding:0 0 10px">In V2 most dates are set by events, not typed. Press one and watch My Tasks, the unit pages and Log Activity change. Demo date: <b>${fmt(S.today)}</b>.</p>
  <div class="demo-btns">${btn('Import bank statement (Payment › Bank Transfer)','sim:bank','ol')}${btn('A seller returns a signed SAAF (SMD records it)','sim:seller','ol')}${btn('A buyer completes KYC in the portal','sim:kyc','ol')}${btn(`Run today’s ${CUTOFF} send (scheduled emails go out)`,'sim:cutoff','ol')}${btn(`Next working day ▶ (${CUTOFF} send, then reminders, deadlines, penalties)`,'sim:day','pr')}${btn('Reset demo data','sim:reset','gh')}</div>`)}
function flushToasts(){const w=$('#toasts');const n=toastQ.length;toastQ.slice(-2).forEach(m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;w.appendChild(d);setTimeout(()=>d.remove(),3500)});
  if(n>2){const d=document.createElement('div');d.className='toast';d.innerHTML=`+${n-2} more · <a href="#/log" style="color:#fff">Log Activity</a>`;w.appendChild(d);setTimeout(()=>d.remove(),3500)}
  while(w.children.length>3)w.firstChild.remove();toastQ=[]}
function toast(m){toastQ.push(m);flushToasts()}
function render(){const h=(location.hash||'#/').slice(2),p=h.split('/');
  $('#today').textContent='Demo date '+fmt(S.today);renderMenu(h);
  const v=h===''?vHome():p[0]==='unit'?vUnit(p[1]):p[0]==='customer'?vCustomer(p[1]):p[1]==='my-tasks'&&['FAD','SMD','VWD'].includes(p[0])?vTasks(p[0],p[2]):h==='FAD/settlement-run'?vSettlement():h==='SMD/saaf'?vSaaf():h==='FAD/documents'?vDocs():
    h==='Approval/approvals'?vApprovals():h==='Auction/result-price'?vResultPrice():h==='Payment/bank-transfer'?vBank():h==='Report/pipeline'?vPipeline():h==='Customer/customer-inquiry'?vCustomers():h==='log'?vLog():h==='compare'?vCompare():vHome();
  $('#content').innerHTML=v;flushToasts()}
function after(){runAuto();render()}
document.addEventListener('click',ev=>{const t=ev.target;
  if(t.closest('#burger')){if(narrow())document.body.classList.toggle('nav-open');else setCollapsed(!document.body.classList.contains('nav-collapsed'));return}
  if(t.closest('#scrim')){closeNav();return}
  const g=t.closest('[data-group]');if(g){OPEN[g.dataset.group]=!OPEN[g.dataset.group];renderMenu((location.hash||'#/').slice(2));return}
  const dis=t.closest('[data-disabled]');if(dis){toast(`“${dis.dataset.disabled}” is not part of this V2 concept.`);return}
  if(t.closest('.mis, a.mi')&&narrow())closeNav();
  if(t.closest('[data-open=demo]')){demoModal();return}
  if(t.closest('[data-close]')){closeModal();return}
  if(t.closest('[data-ok]')){if(modalOk&&modalOk()===false)return;closeModal();after();return}
  const s=t.closest('[data-lsort]');if(s){const[id,i]=s.dataset.lsort.split(':'),u=U(id);if(u.sort===+i)u.dir=-u.dir;else{u.sort=+i;u.dir=1}render();return}
  const pg=t.closest('[data-lpage]');if(pg){if(pg.disabled)return;const[id,i]=pg.dataset.lpage.split(':');U(id).page=+i;render();return}
  const rs=t.closest('[data-lreset]');if(rs){const u=U(rs.dataset.lreset);u.f={};u.page=0;render();return}
  const b=t.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a.startsWith('sim:')){const inDemo=!!t.closest('.demo-btns');SIM[a.slice(4)]();after();if(inDemo)demoModal();return}
  if(a==='approve'||a==='reject'){decide(b.dataset.arg,a==='approve');if(a==='approve')after();else render();return}
  if(ACT[a](lot(b.dataset.lot),b.dataset.arg)==='keep')return;
  if(!$('#modal').innerHTML)after();else render()});
let bgDown=false;
document.addEventListener('mousedown',ev=>{bgDown=!!(ev.target.hasAttribute&&ev.target.hasAttribute('data-bg'))});
document.addEventListener('mouseup',ev=>{if(bgDown&&ev.target.hasAttribute&&ev.target.hasAttribute('data-bg'))closeModal();bgDown=false});
document.addEventListener('submit',ev=>{const f=ev.target.closest('[data-lform]');if(!f)return;ev.preventDefault();const u=U(f.dataset.lform);u.f=Object.fromEntries(new FormData(f));u.page=0;render()});
document.addEventListener('change',ev=>{const s=ev.target.closest('[data-lsize]');if(s){const u=U(s.dataset.lsize);u.size=+s.value;u.page=0;render()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if($('#modal').innerHTML)closeModal();else closeNav()});
window.addEventListener('hashchange',()=>{const p=(location.hash||'').slice(2).split('/')[0];if(p in OPEN)OPEN[p]=true;closeModal();render();window.scrollTo(0,0)});
window.addEventListener('resize',()=>{if(!narrow())closeNav()});
runAuto();S.feed=[];toastQ=[];render();
</script>
</body>

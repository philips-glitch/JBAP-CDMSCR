:root{
  --navy:#293a8e; --navy-dark:#172565; --navy-mid:#22317a; --navy-deep:#1c2a6c; --navy-active:#3f4e9a; --edit:#2d55b8;
  --bg:#f0f3f8; --card:#fff; --text:#1f2433; --muted:#4b5571; --faint:#6b7491; --line:#e5e9f2; --line-2:#c9d1e3;
  --zebra:#f7f9fc; --sel:#e4ebfb; --dirty-bg:#fff8e1; --dirty-bd:#e0b64a; --danger:#b42318; --ok:#1b7343;
  --side-w:315px; --top-h:72px; --radius:4px;
  --font-ui:'Open Sans',Arial,sans-serif; --font-head:'Oswald','Arial Narrow',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{width:var(--side-w);flex:none;background:var(--navy);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.side-h{height:73px;flex:none;display:flex;align-items:center;padding-left:23px;font-family:var(--font-head);font-weight:600;font-size:19px;color:#fff;letter-spacing:.2px}
.menu{flex:1;overflow-y:auto;padding-bottom:16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.mi{width:100%;height:49px;display:flex;align-items:center;padding:0 40px 0 20px;background:none;border:0;color:#d6dbef;font-family:var(--font-head);font-weight:500;font-size:15.5px;letter-spacing:.15px;position:relative;text-align:left}
.mi img,.mi svg{width:26px;height:26px;margin-right:10px;flex:none}
.mi .caret{position:absolute;right:16px;top:50%;margin-top:-2px;border-top:5px solid #c9cee6;border-left:4.5px solid transparent;border-right:4.5px solid transparent;transition:transform .15s}
.mi[aria-expanded="true"]{color:#fff;background:#2f409a}
.mi[aria-expanded="true"] .caret{transform:rotate(180deg)}
.mi:not(.is-disabled):hover{background:#33449e;color:#fff}
.mi.is-disabled{opacity:.38;cursor:not-allowed}
a.mi{text-decoration:none}
.mi.is-active{background:var(--navy-active);color:#fff;box-shadow:inset 4px 0 0 #fff}
.mi:focus-visible,.mis:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.lvs{background:var(--navy-mid);padding:4px 0 6px}
.lvs[hidden]{display:none}
.mis{display:flex;align-items:center;height:33px;padding-left:56px;color:#bcc3e2;font-family:var(--font-head);font-weight:400;font-size:14.5px;letter-spacing:.2px;position:relative;text-decoration:none}
.mis:before{content:'';position:absolute;left:30px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;border:1.5px solid #7f89bd}
.mis:hover{color:#fff;background:#2a3a88}
.mis.is-active{background:var(--navy-active);color:#fff;box-shadow:inset 4px 0 0 #fff}
.mis.is-active:before{background:#fff;border-color:#fff}
.mis .cnt{margin-left:auto;margin-right:16px;font-family:var(--font-ui);font-size:11px;background:rgba(255,255,255,.14);border-radius:9px;padding:0 7px;line-height:17px}
.side-note{padding:10px 20px 4px;color:#9aa3cf;font-size:11.5px;line-height:1.4}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:var(--top-h);flex:none;background:#fff;display:flex;align-items:center;gap:14px;padding:0 4px 0 7px;border-bottom:1px solid #e3e7ef;position:sticky;top:0;z-index:20}
.top .logo{height:46px;cursor:pointer}
.top .user{height:62px;margin-left:auto}
.proto-tag{font-size:11.5px;font-weight:600;color:#7a5a00;background:#fff4cc;border:1px solid #f0d27a;border-radius:12px;padding:3px 10px}
.burger{display:none;border:1px solid var(--line-2);background:#fff;border-radius:4px;width:38px;height:38px;align-items:center;justify-content:center}
.content{flex:1;padding:16px 12px 24px 13px}
.foot{height:26px;flex:none;background:#c4cddb;display:flex;align-items:center;justify-content:center;font-size:12px;color:#2a2f3d}

/* ---------- Page head ---------- */
.crumb{font-size:12.5px;color:var(--faint);display:flex;gap:7px;align-items:center}
.crumb a{color:var(--faint);text-decoration:none}.crumb a:hover{text-decoration:underline}
.crumb b{color:var(--navy);font-weight:600}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:3px;flex-wrap:wrap}
h1{font-family:var(--font-head);font-weight:600;font-size:30px;color:#141414;margin:0;line-height:1.2}
.acts{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--faint);padding-bottom:5px}
.pill{border:1px solid #9aa4cf;color:var(--navy);background:#fff;border-radius:12px;padding:2px 11px;font-size:12px;font-weight:600}
.pill.u{background:var(--navy);color:#fff;border-color:var(--navy)}
.rule{margin-top:7px;font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
.rule svg{color:var(--navy);flex:none;margin-top:1px}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(23,37,101,.13);margin-top:14px;overflow:hidden}
.card-h{background:var(--navy);color:#fff;min-height:50px;display:flex;align-items:center;padding:0 16px;gap:11px;font-size:14px}
.card-h .ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.17);display:flex;align-items:center;justify-content:center;flex:none}
.card-h .bdg{background:rgba(255,255,255,.2);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:600}
.card-h .sp{flex:1}
.card-h .hint{font-size:12px;color:#c9cfeb;display:flex;gap:14px}
.fb{padding:12px 16px 14px;display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;width:205px}
.fld.w1{width:150px}.fld.w2{width:300px}.fld.w3{width:440px}
.fld label,.fld .lbl{font-size:12px;font-weight:600;color:#3b4466}
/* multi-select filter dropdown (JBAP, 19 Oct 2026): a button that opens a list of tick boxes */
.card.filter{overflow:visible}.card.filter .card-h{border-radius:var(--radius) var(--radius) 0 0}
.msel{position:relative}.msel>summary{list-style:none;cursor:pointer;display:flex;align-items:center}.msel>summary::-webkit-details-marker{display:none}
.msel>summary::after{content:"";flex:none;margin-left:auto;padding:0;border:5px solid transparent;border-top-color:#3b4466;border-bottom:0}
.msel-t{min-width:0;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel>summary:focus-visible{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(41,58,142,.18)}
.msel-p{position:absolute;z-index:20;top:100%;left:0;min-width:100%;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line-2);border-radius:4px;box-shadow:0 6px 18px rgba(23,37,101,.15);padding:6px 10px}
.msel-f{position:sticky;bottom:-6px;margin:6px -10px -6px;padding:8px 10px;background:#fff;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px}.msel-f .btn{height:30px}
.fld .msel-p .chkline{height:30px;white-space:nowrap;font-size:13px;font-weight:400;color:var(--text)}
.note.msel-hint{margin:0;padding:10px 18px 0}
.ctl{height:34px;border:1px solid var(--line-2);border-radius:3px;background:#fff;padding:0 10px;font-size:13px;width:100%}
.ctl:focus,.cell-in:focus,textarea.ctl:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 2px rgba(41,58,142,.18)}
textarea.ctl{height:76px;padding:8px 10px;resize:vertical}
.ctl[readonly]{background:#f1f3f8;color:var(--muted)}
.range{display:flex;gap:6px;align-items:center}.range .ctl{width:auto;flex:1;min-width:0;padding:0 6px}
.err{color:var(--danger);font-size:12px;min-height:0}
.is-invalid{border-color:var(--danger)!important;background:#fff5f5!important}
.btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{height:34px;padding:0 15px;border-radius:3px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--navy)}
.btn.pr{background:var(--navy);color:#fff}
.btn.pr:hover{background:#22327c}
.btn.ol{background:#fff;color:var(--navy)}
.btn.ol:hover{background:#f2f4fb}
.btn.gh{background:#fff;color:var(--muted);border-color:#cfd6e6}
.btn.dg{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .n{background:rgba(255,255,255,.25);border-radius:9px;padding:0 6px;font-size:11px}
.btn.ol .n{background:#e6e9f5}

/* ---------- Table ---------- */
.tb{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #e6eaf2;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tb select{height:28px;border:1px solid var(--line-2);border-radius:3px;padding:0 6px;margin:0 6px;background:#fff}
.lg{display:flex;gap:14px;align-items:center}
.lg span{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:2px;display:inline-block}
.sw.l{background:var(--navy-dark)}.sw.e{background:var(--edit)}.sw.d{background:var(--dirty-bg);border:1px solid var(--dirty-bd)}
.msg{margin:10px 16px 0;padding:9px 12px;border-radius:3px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.msg.error{background:#fdecec;color:#8a1c12;border:1px solid #f3c2bd}
.msg.info{background:#eef2fb;color:#2a3a7a;border:1px solid #cfd8f0}
.tw{padding:0 16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--navy-dark);color:#fff;font-weight:600;padding:0;text-align:center;border-right:1px solid #2b3a7d;vertical-align:middle;font-size:12.3px}
th:last-child{border-right:0}
th.ed{background:var(--edit)}
th .hb{width:100%;min-height:40px;background:none;border:0;color:#fff;font-weight:600;padding:6px 7px;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.25}
th .hb:hover{background:rgba(255,255,255,.08)}
th .lk{opacity:.6;flex:none}
.si{display:inline-block;width:7px;height:11px;margin-left:2px;position:relative;opacity:.45;flex:none}
.si:before,.si:after{content:'';position:absolute;left:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent}
.si:before{top:0;border-bottom:4px solid #fff}.si:after{bottom:0;border-top:4px solid #fff}
th[aria-sort="ascending"] .si,th[aria-sort="descending"] .si{opacity:1}
th[aria-sort="ascending"] .si:after{opacity:.25}
th[aria-sort="descending"] .si:before{opacity:.25}
td{padding:0 8px;height:34px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr.is-dirty td{background:#fffdf4}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx.wrap{overflow:visible;text-overflow:clip;white-space:normal;min-width:220px}   /* a long note wraps inside its column width instead of being cut; the table scrolls sideways before the note gets narrower than this */
tfoot td{font-weight:700;background:#eef1f8;border-top:2px solid var(--line-2);border-bottom:0}
.cell-in{height:26px;border:1px solid #b7c2dd;border-radius:3px;background:#fff;padding:0 6px;font-size:12.5px;width:100%;min-width:118px}
.cell-in.num{text-align:right;min-width:100px}
.cell-in.is-dirty,.chk.is-dirty{background:var(--dirty-bg);border-color:var(--dirty-bd)}
.chk{width:17px;height:17px;accent-color:var(--navy);cursor:pointer;vertical-align:middle}
.chk.is-dirty{outline:2px solid #f2d27a;outline-offset:1px}
.ro-chk{display:inline-flex;width:16px;height:16px;border-radius:3px;border:1.5px solid #c2c8d8;background:#f1f3f8;align-items:center;justify-content:center;color:#fff;vertical-align:middle}
.ro-chk.on{background:#8f99c2;border-color:#8f99c2}
.st{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600}
.st.sold{background:#e2f3e9;color:var(--ok)}.st.ns{background:#eceff4;color:#59627a}.st.cx{background:#fde7e7;color:var(--danger)}.st.up{background:var(--sel);color:var(--edit)}
.blank{color:var(--faint);font-style:italic}
.late{color:var(--danger);font-weight:600}
.empty{padding:38px 16px;text-align:center;color:var(--faint)}
.empty svg{color:#b8c0d8;margin-bottom:6px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.pg{display:flex;justify-content:space-between;align-items:center;padding:11px 16px 13px;font-size:12.5px;color:var(--muted);gap:10px;flex-wrap:wrap}
.pgr{display:flex;gap:4px}
.pb{min-width:30px;height:28px;padding:0 9px;border:1px solid #cfd6e6;border-radius:3px;background:#fff;color:var(--navy)}
.pb.is-active{background:var(--navy);color:#fff;border-color:var(--navy)}
.pb[disabled]{color:#a6aec2;cursor:not-allowed}

/* ---------- Entry form (Cancellation Entry) ---------- */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 22px;padding:16px 18px 6px}
.fgrid.two{grid-template-columns:1fr 1fr}
.fgrid .fld{width:auto}
.fgrid .full{grid-column:1/-1}.fgrid .half{grid-column:span 2}
.note{font-size:12.5px;color:var(--faint);padding:0 18px 14px}
.chkline{display:flex;align-items:center;gap:9px;height:34px;font-size:13px}

/* ---------- Home ---------- */
.home h1{margin:6px 0 4px}
.home .lead{color:var(--muted);font-size:13.5px;max-width:900px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:18px}
@media (min-width:1101px) and (max-width:1399px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1400px){.hgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hcard{background:var(--navy);color:#fff;border-radius:var(--radius);box-shadow:0 1px 3px rgba(23,37,101,.2);overflow:hidden}
.hcard .card-h{border-bottom:1px solid rgba(255,255,255,.25);min-height:70px}
.hcard ul{list-style:none;margin:0;padding:10px 16px 16px}
.hcard li a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:13.5px;padding:6px 4px;border-radius:3px}
.hcard li a:before{content:'';width:5px;height:5px;background:#fff;flex:none}
.hcard li a:hover{background:rgba(255,255,255,.08)}
.hcard .cnt{margin-left:auto;background:rgba(255,255,255,.2);border-radius:10px;padding:1px 9px;font-size:11px}
.hcard .sub{font-size:12px;color:#c9cfeb;padding:0 16px 12px;margin-top:-6px}

/* ---------- Modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(14,20,45,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(860px,100%)}
.modal.wide{width:min(1040px,100%)}
.modal-h{background:var(--navy);color:#fff;padding:14px 18px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:10px;font-weight:600}
.modal-h .x{margin-left:auto;background:none;border:0;color:#fff;font-size:20px;line-height:1}
.modal-b{padding:16px 18px;max-height:65vh;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.modal-f .left{margin-right:auto;font-size:12px;color:var(--faint)}
.mail{border:1px solid var(--line);border-radius:4px;margin-bottom:14px}
.mail-h{background:#f6f8fc;padding:10px 12px;font-size:12.5px;display:grid;grid-template-columns:80px 1fr;gap:4px 8px;border-bottom:1px solid var(--line)}
.mail-h b{color:var(--faint);font-weight:600}
.mail-b{padding:12px;font-size:13px;line-height:1.55}
.mail-b p{margin:0 0 10px}.mail-b p:last-child{margin-bottom:0}
.mail-b .utbl{overflow-x:auto;margin:0 0 10px}.mail-b .utbl table{width:auto;min-width:100%;font-size:12.5px}
.mail-b .utbl th{background:#eef1f8;color:var(--text);border:1px solid #b9bfcc;padding:5px 8px;text-align:left;font-weight:600;white-space:nowrap}
.mail-b .utbl td{border:1px solid #b9bfcc;padding:4px 8px;height:auto;white-space:normal;background:#fff}
.mail-b .utbl td:nth-child(3),.mail-b .utbl td:nth-child(6){white-space:nowrap}
/* editable email body (JBAP, 26 Oct 2026, later): Edit / Done and Reset to standard text above the body; the body gets an outline while it can be typed in */
.mail-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px 0}
.em-btn{min-height:30px;padding:3px 11px;border-radius:3px;font-size:12px;font-weight:600;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.em-btn:hover{background:#f2f4fb}.em-btn.gh{border-color:#cfd6e6;color:var(--muted)}
.em-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.em-state{font-size:12px;color:var(--faint)}.mail.edited .em-state{color:var(--navy);font-weight:600}
.em-body[contenteditable]{outline:2px solid var(--navy);outline-offset:4px;border-radius:2px;background:#fffef6;cursor:text}
@media (max-width:480px){.em-btn{min-height:40px;padding:6px 12px}.em-state{flex:1 1 100%}}
.dlg-h{font-size:13.5px;color:var(--navy);margin:0 0 8px}.modal-b .dlg-h:not(:first-child){margin-top:18px}
@media (max-width:480px){.modal-f{flex-wrap:wrap}.modal-f .left{flex:1 1 100%;margin-right:0}}   /* phone: the note takes its own line above the buttons */
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:3px;padding:3px 8px;font-size:12px;background:#fff}
.toast-wrap{position:fixed;right:18px;bottom:40px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#1d2a64;color:#fff;padding:11px 14px;border-radius:5px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;max-width:380px;display:flex;gap:8px;animation:tin .2s ease-out}
.toast.warn{background:#7a4a00}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Responsive: tablet ---------- */
@media (max-width:1100px){
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.25)}
  body.nav-open .side{transform:none}
  .burger{display:inline-flex}
  .hgrid{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:768px){
  .hgrid{grid-template-columns:1fr}
  .fld,.fld.w1,.fld.w2,.fld.w3{width:100%}
  .fgrid{grid-template-columns:1fr}
  .acts{display:none}
  .top{gap:8px}.top .logo{height:30px}.top .user{height:48px}   /* phone width: the top bar fits 375px (burger, logo, Prototype tag, switch) */
}
@media (max-width:480px){.top .user{display:none}}   /* the signed-in picture gives way on a phone; the Prototype disclaimer stays */

/* ---------- Reports (layouts of the MS Access samples) ---------- */
.rpt{background:#fff;color:#111;font-size:12px;line-height:1.45;padding:16mm 14mm;margin:0 auto 16px;border:1px solid var(--line);max-width:1040px}
.rpt h1{font-family:var(--font-head);font-size:22px;text-align:center;margin:0 0 14px;letter-spacing:.3px}
.rpt h2{font-size:14px;text-align:center;margin:0 0 2px}
.rpt h3{font-size:12px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.3px}
.rpt p{margin:6px 0}
.rpt table{width:100%;border-collapse:collapse;margin:8px 0}
.rpt th{color:#111;background:#eef1f8;border:1px solid #b9bfcc;padding:5px 6px;font-size:11px;text-align:left;font-weight:600}
.rpt td{border:1px solid #b9bfcc;padding:4px 6px;font-size:11.5px;vertical-align:top}
.rpt .r{text-align:right}.rpt .c{text-align:center}
.rpt tfoot td{font-weight:700;background:#f6f7fb}
.rpt .kv{display:grid;grid-template-columns:140px 1fr 140px 1fr;gap:4px 12px;margin-bottom:10px}
.rpt .kv b{font-weight:600;color:#444}
.rpt .rsign{display:flex;gap:48px;margin-top:42px}.rpt .rsign div{flex:1;border-top:1px solid #333;padding-top:4px;text-align:center;font-size:11px}
.rpt .fn{font-size:10.5px;color:#555}
.rpt .rbox{display:inline-block;width:12px;height:12px;border:1px solid #333;margin-right:6px;vertical-align:-2px;text-align:center;line-height:11px;font-size:10px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
/* Cancellation Fee Billing: logo left, title in a box, as JBAP's sample (28 Oct 2026) */
.rpt.cxl .cxl-h{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:16px}.rpt.cxl .cxl-h img{height:56px}
.rpt.cxl .cxl-h h1{border:1px solid #333;padding:14px 28px;margin:0;font-weight:400;letter-spacing:.5px}
/* SAAF: JBAP's paper form (27 Oct 2026) */
.rpt.saaf .saaf-h{display:flex;align-items:center;gap:16px;margin-bottom:10px}.rpt.saaf .saaf-h img{height:44px}.rpt.saaf .saaf-h h1{flex:1;margin:0;text-align:center;padding-right:60px}
.rpt.saaf .saaf-kv{width:auto;min-width:360px}.rpt.saaf .saaf-kv th{width:150px}
.rpt.saaf thead th{text-align:center;font-size:9px;vertical-align:middle;padding:4px 3px;white-space:normal}.rpt.saaf td{font-size:10px;padding:3px 4px;white-space:normal}
.rpt.saaf .saaf-t{font-size:10.5px;text-align:justify;margin-top:12px}
/* SAAF screen: auction list (master) above the vehicle list (detail) */
.saaf-au th{padding:10px 8px}.saaf-au tr.is-sel td{background:#e7edfb}
.saaf-au .pick{font:inherit;background:none;border:0;padding:0;color:var(--navy);font-weight:700;text-decoration:underline;cursor:pointer}
.saaf-au .pick:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.saaf-au td{height:42px}.saaf-au .btn{padding:4px 10px;min-height:0;font-size:12px}.saaf-au .dti{display:inline-flex;width:150px;vertical-align:middle}.saaf-au .err{display:block;white-space:normal;font-size:11.5px}.saaf-au .lk{color:var(--faint)}
.saaf-au tr.is-dirty td{background:#fffdf4}
.saaf-sub{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--faint)}.saaf-sub .btn{text-decoration:none}
/* Result Price › KYC Status: a switch (Pending / Approved) */
.tg{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 4px;font:inherit;font-size:12px;cursor:pointer;color:#555}
.tg .tg-k{width:26px;height:14px;border-radius:8px;background:#c9ced9;position:relative;flex:none}.tg .tg-k:after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{color:#1d6b3a;border-color:#9fd3b0;background:#eefaf2}.tg.on .tg-k{background:#2e9b57}.tg.on .tg-k:after{left:14px}
.tg:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.dt-lot{border:1px solid var(--line);border-radius:4px;margin:0 0 12px;padding:8px 12px}.dt-lot .cols2{margin-bottom:8px}
.rpt .split{display:grid;grid-template-columns:2fr 1fr;gap:18px;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;break-inside:avoid;page-break-inside:avoid}
.rpt .split .kv{grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;margin-bottom:6px}
.rpt .split .gp .kv{grid-template-columns:auto 1fr}
.rpt .split .cols2{grid-template-columns:repeat(5,auto);gap:2px 12px}
.rpt .split .rsign{margin-top:24px;gap:24px}
.rpt .split p{margin:3px 0}
.rpt .split:last-child{border-bottom:0}
button.att{cursor:pointer;font-family:inherit;color:inherit}button.att:hover{background:#f6f8fc}

/* ---------- Print ---------- */
@media print{
  .side,.top,.foot,.acts,.card.filter,.tb,.pg,.btns,.toast-wrap,.burger{display:none!important}
  .content{padding:0}
  .card{box-shadow:none;border:1px solid #ccc}
  .tw{overflow:visible}
  body.printing .app{display:none}
  body.printing .modal-bg{position:static;background:none;padding:0}
  body.printing .modal{box-shadow:none;width:100%}
  body.printing .modal-h,body.printing .modal-f{display:none}
  body.printing .modal-b{max-height:none;overflow:visible;padding:0}
  body.printing .no-print{display:none!important}
  .rpt{border:0;margin:0;padding:0;max-width:none;page-break-after:always}
  .rpt:last-child{page-break-after:auto;break-after:auto}
  .rpt.portrait{page:rpt-portrait}
  .rpt.landscape{page:rpt-landscape}
  @page{size:A4 landscape;margin:12mm}
}
/* Named pages for the reports (top level: named @page rules are not reliably accepted inside @media) */
@page rpt-portrait{size:A4 portrait;margin:12mm}
@page rpt-landscape{size:A4 landscape;margin:12mm}
table.cmp th{font-size:11.5px}table.cmp th .hb{padding:5px 4px}table.cmp td{padding:0 5px;font-size:12px}
/* ── Proposed improvements switch and tags (spec 2026-10-15) ── */
.prop-switch{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;white-space:nowrap}

.top .prop-switch+.user{margin-left:6px}
.ptag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:9px;font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:0;line-height:17px;vertical-align:middle;white-space:nowrap;background:#fff4cc;color:#7a5a00;border:1px solid #f0d27a}
.ptag.wish{background:#e2f3e9;color:#1d6b3c;border-color:#a9d8bb}

@media print{.ptag{display:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.msg[hidden]{display:none}
/* P6: menu badges and the Home panels (switch on) */
.qbs{margin-left:auto;margin-right:12px;display:flex;gap:4px}
.qb{font-family:var(--font-ui);font-size:11px;line-height:17px;padding:0 7px;border-radius:9px;background:rgba(255,255,255,.18);color:#fff}
.qb.late{background:#b42318}
.pp-list{list-style:none;margin:0;padding:12px 18px 14px;display:grid;gap:8px;font-size:13px}
.pp-list .ptag{margin-left:0}
.pp-wait{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:12px 18px 16px}
.pp-wait h3{margin:0 0 6px;font-size:13px}
.pp-wait ul{list-style:none;margin:0;padding:0}
.pp-wait li a{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:13px;color:inherit;text-decoration:none}
.pp-wait li a:hover{text-decoration:underline}
.pp-wait .cnt{margin-left:auto;border-radius:9px;padding:0 8px;font-size:11px;background:#e8ecf7}

.pp-wait .none{font-size:12.5px;color:#7b8299}
@media (max-width:768px){.pp-wait{grid-template-columns:1fr}}
/* JBAP feedback: Document Monitoring columns that do not apply to the seller */
td.na{color:#5c6378;background:#f3f5f9;font-size:11.5px}
/* Tabs: screens grouped under one menu entry (FAD › Billing) */
.tabs{display:flex;gap:4px;margin-top:12px;box-shadow:inset 0 -1px 0 var(--line-2);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--navy);background:var(--zebra)}
.tab.is-active{background:var(--card);color:var(--navy);border-color:var(--line-2);border-bottom:1px solid var(--card)}
.tab .cnt{font-size:11px;font-weight:600;background:#e8ecf7;border-radius:9px;padding:0 7px;line-height:17px}
.tab:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
/* Customer Inquiry and the customer page (16 Oct 2026) */
button.mis{width:100%;background:none;border:0;text-align:left}
.mis.is-disabled{opacity:.45;cursor:not-allowed}
.mis.is-disabled:hover{background:none;color:#bcc3e2}
a.blink{color:var(--navy);font-weight:600;text-decoration:none}
a.blink:hover{text-decoration:underline}
.tab.is-disabled{opacity:.5;cursor:not-allowed}
.tab.is-disabled:hover{background:none;color:var(--muted)}
.tab .cnt.warn{background:#fde9c4;color:#7a4a00}
th span.hb{cursor:default}
th span.hb:hover{background:none}
.cust-h{font-size:15px;color:var(--navy);font-weight:700;margin:16px 0 0;letter-spacing:.2px}
.cust-sub{font-size:12.5px;color:var(--faint);margin:2px 0 0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:12px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(23,37,101,.13);border-top:3px solid var(--navy);padding:12px 16px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--faint)}
.kpi .v{font-family:var(--font-head);font-size:26px;font-weight:600;color:var(--navy);margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.tabs.in-card{margin:10px 16px 0}
.sa-h{margin:16px 16px 0;font-size:13.5px;font-weight:700;color:var(--navy)}   /* customer page, Sales Actions tab: the Add sales action form heading */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:768px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Typed dates (JBAP feedback 16 Oct 2026, #4) */
.dti{position:relative;display:flex;align-items:center}
.dti .dt{padding-right:26px}
.dtp{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);padding:2px;display:flex}
.dtp:hover{color:var(--navy)}
#dt-picker{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;margin:0}

</style>
<style>
/* V2 additions on top of the V1 CDMS styles (same tokens and components) */
.burger{display:inline-flex}
body.nav-collapsed .side{display:none}
.scrim{display:none}
@media (max-width:1100px){body.nav-collapsed .side{display:flex}.scrim{position:fixed;inset:0;background:rgba(14,20,45,.4);z-index:25}body.nav-open .scrim{display:block}}
.src{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:8px;border:1px solid;line-height:16px;white-space:nowrap;vertical-align:middle}
.src.auto{color:var(--ok);border-color:#9fd3b6;background:#eef8f2}
.src.link{color:#6b3fb3;border-color:#c9b5ec;background:#f4effc}
.src.click{color:var(--edit);border-color:#a9c3ea;background:var(--sel)}
.src.scan{color:#8a5a00;border-color:#ecc98e;background:#fdf5e8}
.src.manual{color:var(--danger);border-color:#efb0aa;background:#fdeeed}
.prio{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e0a100}
.prio.high{background:var(--danger)}.prio.low{background:#aab3c8}
.steps{display:flex;gap:4px;padding:12px 16px 14px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:8px 10px;border-top:4px solid #d3d9e6;background:#fafbfd}
.step.done{border-color:var(--ok)}.step.cur{border-color:#e0a100;background:#fffaf0}
.step .h{font-size:12px;font-weight:600;color:#3b4466}.step .d{font-size:12px;color:var(--faint);margin-top:2px}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 16px 14px}
.tracks h4{margin:0 0 6px;font-family:var(--font-head);font-weight:500;font-size:15px;color:var(--navy)}
.tracks .step{min-width:0;margin-bottom:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.nextbox{padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.nextbox .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{width:100%;font-size:13px}.kv td{height:30px}.kv td:last-child{text-align:right}
.kpis.v2{grid-template-columns:repeat(4,minmax(0,1fr))}
.bars{padding:12px 16px}.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.bar .lab{width:260px}.bar .b{height:16px;background:var(--navy);border-radius:2px;min-width:2px}
.v2tag{font-size:10px;font-weight:700;color:#fff;background:#1b7343;border-radius:8px;padding:0 6px;margin-left:6px;line-height:16px;font-family:var(--font-ui)}
.wrapcell{white-space:normal;line-height:1.35;padding:6px 8px;min-width:220px}
td .btn{height:28px;padding:0 10px;font-size:12px}
.demo-btns{display:grid;gap:8px}.demo-btns .btn{justify-content:flex-start}
.top a.btn{text-decoration:none}
.top .demo-date{font-size:12.5px;color:var(--faint)}
.saaf{border:1px solid #c9cfdd;background:#fff;padding:12px;font-size:12px;color:#1d2440}
.saaf h3{margin:0 0 8px;text-align:center;font-size:14px;letter-spacing:.3px}
.saaf table{width:100%;border-collapse:collapse}.saaf th,.saaf td{border:1px solid #c9cfdd;padding:3px 5px;height:auto}
.saaf th{background:#f3f5fa;color:#1d2440;font-size:11px;font-weight:600;text-align:left}.saaf .fine{font-size:10.5px;text-align:center;margin:10px 0 18px;line-height:1.4}
.saaf .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center;font-size:10.5px}.saaf .sig div{border-top:1px solid #1d2440;padding-top:4px}
.saaf .qr{float:right;border:1px dashed #8a93ad;padding:4px 6px;font-size:10px;color:#55607e}
@media (max-width:1100px){.tracks,.two{grid-template-columns:1fr}.kpis.v2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:768px){.top .demo-date,.top a.btn{display:none}.top [data-open=demo]{padding:0 10px}}
@media (max-width:480px){.top .proto-tag{display:none}}
</style>

const deadline=l=>l.ev.baaf?(l.deadlineOverride||addWD(l.ev.baaf.d,3)):null;
const rebateDone=l=>!l.rebate||l.rebate.status!=='pending';
function dispatchReady(l){const s=SELLERS[l.seller];if(!l.ev.paid)return false;
  if(s.release==='buyer_payment')return true;if(s.release==='seller_ack')return !!l.ev.seller_ack;return !!l.ev.doas_back}
const releaseBlock=l=>(SELLERS[l.seller].doas!=='none'&&!l.ev.doas_back)?'Signed DOAS not received yet':null;
const pullDeadline=l=>l.ev.dispatch?addWD(l.ev.dispatch.d,3):null;
function penalty(l){if(!l.ev.dispatch||l.ev.release)return 0;return Math.max(0,calDays(pullDeadline(l),S.today))*500}
const money=l=>{const s=SELLERS[l.seller],com=l.price*.05,vat=com*.12,reb=(l.rebate&&l.rebate.status==='approved')?l.rebate.amt:0;
  return {fee:s.fee,buyer:l.price+s.fee-reb,com,vat,reb,payable:l.price+s.fee-com-vat}};
const closed=l=>l.cancel?(l.cancel.waived||!!l.cancel.feePaid):!!(l.ev.release&&l.ev.docs_out&&l.ev.seller_ack&&l.ev.comm_billed);
function stage(l){
  if(l.cancel)return {k:'cancelled',t:closed(l)?'Cancelled':'Cancelled · fee unpaid',c:closed(l)?'ns':'cx'};
  if(!l.ev.kyc)return {k:'kyc',t:'Waiting KYC',c:'ns'};
  if(!l.ev.saaf_ok)return l.saafDeclined?{k:'saaf',t:'Seller declined (SAAF)',c:'cx'}:{k:'saaf',t:l.ev.saaf_sent?'Waiting signed SAAF':'SAAF to send',c:'ns'};
  if(!l.ev.baaf)return {k:'award',t:rebateDone(l)?'Pending Awarding':'Pending Awarding · rebate',c:'up'};
  if(!l.ev.paid)return S.today>deadline(l)?{k:'pay',t:'Unpaid · overdue',c:'cx'}:{k:'pay',t:'Unpaid',c:'up'};
  if(closed(l))return {k:'closed',t:'Complete',c:'sold'};
  if(l.ev.release)return {k:'after',t:'Released · closing',c:'up'};
  if(l.ev.dispatch)return {k:'after',t:penalty(l)?'For release · overdue':'For release',c:penalty(l)?'cx':'up'};
  return {k:'after',t:'Paid',c:'up'};
}

const KIND={BAAF:{t:'BAAF (awarding)',dept:'FAD',ev:'baaf'},REMIND:{t:'Payment reminder',dept:'SMD',ev:null},
  DOAS:{t:'DOAS for signature',dept:'FAD',ev:'doas_sent'},DISPATCH:{t:'Vehicle dispatch notice',dept:'FAD',ev:'dispatch'}};
const REBATE_HOLD='Rebate waiting for the President';
const ob=(l,k)=>S.outbox.find(o=>o.lot===l.id&&o.kind===k&&o.status!=='dropped');
function schedule(l,kind,held){if(ob(l,kind))return;S.outbox.push({id:S.obSeq++,lot:l.id,kind,status:held?'held':'scheduled',hold:held||null,created:S.today})}
function sendItem(o,how){const l=lot(o.lot),k=KIND[o.kind];o.status='sent';o.sent=S.today;
  if(k.ev)l.ev[k.ev]=E(S.today,how==='now'?'click':'auto',how==='now'?USER[k.dept]:'system');else l.reminded=S.today;
  log(`${k.t} emailed (${how==='now'?'Send now':CUTOFF+' send'})${o.kind==='BAAF'?`; pay by ${fmt(deadline(l))}`:o.kind==='DISPATCH'?`; pull out by ${fmt(addWD(S.today,3))}`:''}`,how==='now'?'click':'auto',k.dept,l)}
function cutoff(){S.outbox.filter(o=>o.status==='scheduled').forEach(o=>sendItem(o,'cutoff'))}
function runAuto(){
  for(const l of S.lots){const e=l.ev,s=SELLERS[l.seller];
    S.outbox.filter(o=>o.lot===l.id&&o.status!=='sent'&&o.status!=='dropped').forEach(o=>{
      if(l.cancel||(o.kind==='REMIND'&&e.paid)){o.status='dropped';return}
      if(o.kind==='BAAF'){if(!rebateDone(l)){o.status='held';o.hold=REBATE_HOLD}else if(o.hold===REBATE_HOLD){o.status='scheduled';o.hold=null}}});
    if(l.cancel)continue;
    if(e.kyc&&!e.saaf_sent&&!saafOf(l))addToSaaf(l);
    if(e.saaf_ok&&!e.baaf)schedule(l,'BAAF',rebateDone(l)?null:REBATE_HOLD);
    if(e.baaf&&!e.paid&&addWD(S.today,1)===deadline(l)&&l.reminded!==S.today)schedule(l,'REMIND');
    if(e.paid&&s.doas!=='none'&&!e.doas_sent)schedule(l,'DOAS');
    if(dispatchReady(l)&&!e.dispatch)schedule(l,'DISPATCH');
    if(e.seller_paid&&!e.comm_billed){e.comm_billed=E(S.today);log(`Commission billing generated for ${l.seller} (settlement run)`,'auto','FAD',l)}}
}

function tasks(){const T=[],W=[],t=S.today;
  for(const l of S.lots){const e=l.ev,s=SELLERS[l.seller];
    if(l.cancel){if(!closed(l))W.push({dept:'FAD',who:'Buyer',l,txt:`Cancellation fee ${peso(l.cancel.fee)} billed ${fmt(l.cancel.d)}; matched from the bank file when paid`});continue}
    if(!e.kyc){const n=wdBetween(e.sold.d,t);if(n>=2)T.push({dept:'SMD',sev:'med',l,title:'Buyer KYC still missing',m:`${n} working days since the sale; automatic reminders got no response`,due:addWD(e.sold.d,2),acts:[['Remind buyer','remindKyc','ol']]});else W.push({dept:'SMD',who:'Buyer',l,txt:'KYC in the buyer portal'});continue}
    if(!e.saaf_ok){if(l.saafDeclined)T.push({dept:'SMD',sev:'high',l,title:`${l.seller} did not sign for this lot on the SAAF`,m:`Recorded ${fmt(l.saafDeclined)}. Cancel the sale, or record the approval if the seller agrees later`,due:null,acts:[['Cancel sale','cancel','dg'],['Record approval','saafManual','gh']]});
      else if(e.saaf_sent)W.push({dept:'SMD',who:l.seller,l,saaf:1,txt:`Signed SAAF ${saafName(saafOf(l))} (SMD records it when the form comes back)`});continue}
    if(!e.baaf){if(!rebateDone(l))W.push({dept:'FAD',who:'President',l,txt:'Rebate decision; the BAAF is held until then'});else W.push({dept:'FAD',who:'Scheduled send',l,txt:`BAAF goes out at the ${CUTOFF} send`});continue}
    if(!e.paid){const dl=deadline(l);if(t>dl)T.push({dept:'SMD',sev:'high',l,title:'Unpaid after the deadline',m:`Deadline ${fmt(dl)}; the reminder was sent automatically`,due:dl,acts:[['Cancel sale','cancel','dg'],['Request +2 days','extend','ol']]});else W.push({dept:'SMD',who:'Buyer',l,txt:`Payment, deadline ${fmt(dl)}`});continue}
    if(e.seller_paid&&!e.seller_ack)W.push({dept:'FAD',who:l.seller,l,txt:'Signed acknowledgement of payment (FAD records it when it comes back)'});
    if(e.doas_sent&&!e.doas_back){if(s.doas==='jbap')T.push({dept:'FAD',sev:'low',l,title:'Signed DOAS: scan on receipt',m:`DOAS emailed ${fmt(e.doas_sent.d)}; scanning the transmittal QR records the date`,due:null,acts:[['Scan signed DOAS','scanDoas','pr']]});
      else T.push({dept:'FAD',sev:'low',l,title:'DOAS signed at the EWB branch: record on confirmation',m:`Signing notice emailed ${fmt(e.doas_sent.d)}; record it when EWB confirms (email or the signed copy)`,due:null,acts:[['Record signed DOAS','doasBranch','pr']]})}
    if(e.seller_paid&&(s.doas==='none'||e.doas_back)&&!e.docs_in)T.push({dept:'FAD',sev:'low',l,title:'Documents from seller: scan on receipt',m:'ORCR / deed package from the seller',due:null,acts:[['Scan documents','scanDocs','pr']]});
    if(e.dispatch&&!e.release){const p=penalty(l),b=releaseBlock(l);T.push({dept:'VWD',sev:p?'high':'med',l,title:p?`Overdue for pull-out · penalty ${peso(p)}`:'Ready for pull-out',m:b?`Blocked: ${b}`:`Pull-out deadline ${fmt(pullDeadline(l))}`,due:pullDeadline(l),acts:[['Release vehicle','release','pr']]})}
    else if(!e.dispatch)W.push({dept:'VWD',who:s.release==='seller_ack'?l.seller:'Buyer',l,txt:`Dispatch ${RELEASE_TXT[s.release]}`});
    if(e.docs_in&&e.release&&!e.docs_out)T.push({dept:'FAD',sev:'low',l,title:'Hand documents to buyer',m:'Unit released; documents are in',due:null,acts:[['Mark handed over','docsOut','pr']]});
  }
  for(const f of S.saafs){const n=f.lots.length,lt=`${n} lot${n>1?'s':''}`;

function decide(id,ok){const a=S.approvals.find(a=>a.id===+id),l=lot(a.lot);
  const apply=reason=>{a.status=ok?'approved':'rejected';a.at=S.today;a.reason=reason;
    if(a.type==='Rebate'){l.rebate.status=a.status;l.ev.rebate=E(S.today,'click','president')}
    if(a.type==='Payment deadline extension'&&ok)l.deadlineOverride=addWD(deadline(l),2);
    if(a.type==='Fee waiver'&&ok){l.cancel.waived=true;l.cancel.fee=0}
    log(`${a.type} ${a.status}${reason?`. Reason: ${reason}`:''}`,'click','Approval',l,a.role==='President'?'president':'fad.manager')};
  if(ok){apply(null);return}
  modal(`Reject ${a.type.toLowerCase()}`,`<p>${label(l)} · ${l.plate} · ${esc(a.detail)}</p><div class="fld w3"><span class="lbl">Reason (required)</span><input class="ctl" id="rr"></div>`,
    ()=>{const r=$('#rr').value.trim();if(!r)return err('Reason is required.');apply(r)},'Reject','dg')}
const SIM={
  bank:()=>{const rows=[];for(const l of S.lots){
      if(l.cancel&&l.pay==='fee'&&!l.cancel.feePaid&&!l.cancel.waived){l.cancel.feePaid=S.today;rows.push([l,10000,'Cancellation fee matched']);log('Cancellation fee matched from the bank file','auto','Payment',l);continue}
      if(l.cancel||!l.ev.baaf||l.ev.paid)continue;
      if(l.pay==='ok'){l.ev.paid=E(S.today,'auto','system (bank match)');rows.push([l,money(l).buyer,'Matched']);log('Buyer payment matched from the bank file','auto','Payment',l)}
      else if(l.pay==='short'&&!S.exceptions.some(x=>x.lot===l.id)){const a=money(l).buyer-5000;S.exceptions.push({lot:l.id,amt:a});rows.push([l,a,'Short: sent to FAD › My Tasks']);log('Payment short by 5,000.00; sent to FAD › My Tasks','auto','Payment',l)}}
    S.imports.unshift({d:S.today,file:`BANK_${S.today.replace(/-/g,'')}.csv`,rows});if(!rows.length)log('Bank file imported: nothing new to match','auto','Payment')},
  seller:()=>{const f=S.saafs.find(f=>f.status==='sent');if(!f)return log('No SAAF is out with a seller. Mark one as sent first (SMD › SAAF).');
    saafLots(f).filter(l=>!l.ev.saaf_ok&&!l.cancel).forEach(l=>{l.ev.saaf_ok=E(S.today,'click','smd.user (signed SAAF)')});f.status='signed';f.signed=S.today;
    log(`Signed SAAF ${saafName(f)} came back; SMD recorded it (all lots signed)`,'click','SMD')},
  kyc:()=>{const l=S.lots.find(l=>!l.ev.kyc);if(!l)return log('No buyer is waiting for KYC');l.ev.kyc=E(S.today,'auto','buyer portal (KYC)');log('Buyer finished KYC in the buyer portal','auto','Customer',l)},
  cutoff:()=>{const n=S.outbox.filter(o=>o.status==='scheduled').length;cutoff();if(!n)log(`${CUTOFF} send: nothing scheduled`)},
  day:()=>{cutoff();S.today=addWD(S.today,1);log(`New working day: ${fmt(S.today)}`)},
  reset:()=>{S=seed();for(const k in UI)delete UI[k];runAuto();S.feed=[];toastQ=[]}
};

/* ===== Lists: the V1 pattern (Filter card, Show entries, sortable headers, paging) ===== */
const UI={};
const U=id=>UI[id]||(UI[id]={f:{},sort:null,dir:1,page:0,size:10});
function listCard({id,title,cols,rows,filters=[],tb='',none=['No records','']}){const u=U(id);
  let R=rows.filter(r=>filters.every(f=>{const v=u.f[f.key];if(!v)return true;const x=strip(f.get(r));return f.type==='select'?x===v:x.toLowerCase().includes(v.toLowerCase())}));
  if(u.sort!=null&&cols[u.sort]){const c=cols[u.sort],g=c.sv||(r=>strip(c.r(r)));R=[...R].sort((a,b)=>{const x=g(a),y=g(b);return (x>y?1:x<y?-1:0)*u.dir})}
  const n=R.length,pages=Math.max(1,Math.ceil(n/u.size));if(u.page>=pages)u.page=pages-1;if(u.page<0)u.page=0;const P=R.slice(u.page*u.size,(u.page+1)*u.size);
  const fc=filters.length?`<section class="card filter" aria-label="Filter"><div class="card-h"><div class="ico">${IC.filter}</div>Filter</div><form class="fb" data-lform="${id}">${filters.map(f=>`<div class="fld"><label>${f.label}</label>${f.type==='select'?`<select class="ctl" name="${f.key}"><option value="">All</option>${f.options.map(o=>`<option ${u.f[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="ctl" name="${f.key}" placeholder="Type to search" value="${esc(u.f[f.key]||'')}">`}</div>`).join('')}
    <div class="btns"><button type="button" class="btn gh" data-lreset="${id}">${IC.reset}Reset</button><button type="submit" class="btn pr">${IC.search}Apply filter</button></div></form></section>`:'';
  const head=`<thead><tr>${cols.map((c,i)=>`<th ${u.sort===i?`aria-sort="${u.dir>0?'ascending':'descending'}"`:''}>${c.nosort?`<span class="hb">${c.h}</span>`:`<button type="button" class="hb" data-lsort="${id}:${i}">${c.h}<span class="si"></span></button>`}</th>`).join('')}</tr></thead>`;
  const body=P.length?`<div class="tw"><table>${head}<tbody>${P.map(r=>`<tr>${cols.map(c=>`<td class="${c.cls||''}">${c.r(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${IC.inbox}<b>${none[0]}</b>${none[1]}</div>`;
  const pg=`<div class="pg"><span>Showing ${n?u.page*u.size+1:0} to ${Math.min(n,(u.page+1)*u.size)} of ${n} entries</span><div class="pgr"><button type="button" class="pb" data-lpage="${id}:${u.page-1}" ${u.page?'':'disabled'}>Previous</button>${Array.from({length:pages},(_,i)=>`<button type="button" class="pb ${i===u.page?'is-active':''}" data-lpage="${id}:${i}">${i+1}</button>`).join('')}<button type="button" class="pb" data-lpage="${id}:${u.page+1}" ${u.page<pages-1?'':'disabled'}>Next</button></div></div>`;
  return fc+`<section class="card"><div class="card-h"><div class="ico">${IC.table}</div>${title}<span class="bdg">${n}</span></div><div class="tb"><span>Show<select data-lsize="${id}">${[10,15,25,50].map(s=>`<option ${s===u.size?'selected':''}>${s}</option>`).join('')}</select>entries</span>${tb}</div>${body}${pg}</section>`}
const C=(h,r,o={})=>Object.assign({h,r},o);
const lotOf=r=>('l' in r)?(r.l||r.sf||null):(typeof r.lot==='string'?lot(r.lot):r);
const F={auc:{key:'auc',label:'Auction No.',get:r=>lotOf(r)?.auc},seller:{key:'seller',label:'Seller',type:'select',options:SELLER_CODES,get:r=>lotOf(r)?.seller},
  plate:{key:'plate',label:'Plate Number',get:r=>lotOf(r)?.plate},cust:{key:'cust',label:'Customer Name / Buyer ID',get:r=>{const l=lotOf(r);return l&&l.buyer?`${BUYERS[l.buyer]} ${l.buyer}`:''}}};

      C('Action',x=>btn('Preview','obPreview','ol',x.lot,`data-arg="${x.id}"`)+' '+(x.status==='scheduled'?btn('Hold','obHold','gh',x.lot,`data-arg="${x.id}"`):x.hold!==REBATE_HOLD?btn('Release hold','obRelease','gh',x.lot,`data-arg="${x.id}"`):''),{nosort:1})],

function vHome(){const {T}=tasks(),c=d=>T.filter(t=>t.dept===d).length,sc=d=>S.outbox.filter(o=>KIND[o.kind].dept===d&&(o.status==='scheduled'||o.status==='held')).length;
  const hc=(d,items)=>`<div class="hcard"><div class="card-h"><div class="ico">${deptSvg(d==='Approval'?'APP':d)}</div><span style="font-family:var(--font-head);font-size:20px">${d}</span></div><ul>${items.map(([t,h,n])=>`<li><a href="${h}">${t}${n!=null?`<span class="cnt">${n}</span>`:''}</a></li>`).join('')}</ul></div>`;
  return `<div class="home"><h1>Post-Auction · V2 concept</h1><p class="lead">The same CDMS and the same FAD / SMD / VWD menus, with the post-auction work as one flow. Each department opens <b>My Tasks</b>: only what needs a person, most urgent first. CDMS builds the SAAF per seller and prepares the emails (BAAF, reminders, DOAS, dispatch), sent at the ${CUTOFF} cut-off unless someone holds them; payments are matched from the bank file; every date is recorded by the event that caused it. Use <b>Demo events</b> in the header to see lots move, and <b>V1 vs V2</b> for the comparison with the current prototype.</p>
  <div class="hgrid">${hc('SMD',[['My Tasks','#/SMD/my-tasks',c('SMD')],['SAAF','#/SMD/saaf',S.saafs.filter(f=>f.status!=='signed').length],['Scheduled emails','#/SMD/my-tasks/scheduled',sc('SMD')],['Auction › Result Price','#/Auction/result-price',null],['Customer Inquiry','#/Customer/customer-inquiry',null]])}
  ${hc('FAD',[['My Tasks','#/FAD/my-tasks',c('FAD')],['Scheduled emails','#/FAD/my-tasks/scheduled',sc('FAD')],['Settlement Run','#/FAD/settlement-run',runLots().length],['Documents','#/FAD/documents',null],['Payment › Bank Transfer','#/Payment/bank-transfer',null]])}
  ${hc('VWD',[['My Tasks','#/VWD/my-tasks',c('VWD')]])}
  ${hc('Approval',[['Approvals','#/Approval/approvals',pendingApprovals().length],['Report › Pipeline','#/Report/pipeline',null],['Log Activity','#/log',null]])}</div></div>`}

function vCompare(){const R=[
  ['Result & KYC','Auction › Result Price: KYC switched Pending/Approved by hand','KYC read from the buyer’s KYC in the portal','1 switch','0'],
  ['Seller approval (SAAF)','SMD › SAAF: tick For SAAF › Email per lot; later type Seller Approved per lot','SMD › SAAF: CDMS builds one form per auction per seller from the KYC-approved lots; signatures stay on paper; SMD clicks Mark sent and Record signed SAAF once per form','tick + send + typed date, per lot','2 clicks per form'],
  ['Rebate','Result Price: type rebate › Update; President decides in Approval','Same, in one Approval inbox; the scheduled BAAF is held automatically until the decision','2','2'],
  ['Awarding (BAAF)','FAD › Pending Awarding: tick For BAAF, check Awarding Date › Email BAAF','Prepared when KYC, SAAF and rebate are clear; sent at the '+CUTOFF+' send (Preview / Hold / Send now); Awarding Date = send date','tick + send','0 (optional hold)'],
  ['Buyer payment','FAD › Unpaid: type Buyer Paid › Save','Payment › Bank Transfer import matches it by the BAAF reference; only mismatches reach FAD › My Tasks','typed date','0 (exceptions only)'],
  ['Unpaid after deadline','Someone notices on Unpaid; cancel in Result Price','Reminder before the deadline is automatic; overdue lot is an SMD task with Cancel / Extend','find + dialog','1 decision'],
  ['Payment to seller','FAD › Payment Seller: tick Print › type date › print','FAD › Settlement Run: one approval per run','tick + typed date','1 per run'],
  ['Seller acknowledgement','FAD › Seller Acknowledgement: type date per lot','FAD › My Tasks: Record acknowledgement per seller (ticks the lots on the signed copy); date and user recorded','typed date per lot','1 per seller'],
  ['Commission billing','FAD › Billing: tick Print? › type NOAH no. and date › print','Generated with the settlement run (NOAH integration to check)','tick + 2 typed fields','0'],
  ['Dispatch','FAD › Vehicle Dispatch: tick For Dispatch Email? › type Dispatch Date','Notice prepared when the seller’s release condition is met; sent at the '+CUTOFF+' send','tick + typed date','0'],
  ['DOAS & documents','FAD › Document Monitoring: tick DOAS email; type up to 5 receipt dates','FAD › Documents: DOAS email prepared automatically; physical receipts by scanning the transmittal QR','tick + up to 5 dates','2 scans'],
  ['Release & penalty','FAD › Unreleased: Record payment; then VWD › Release vehicle','VWD › My Tasks › Release vehicle collects the penalty in the same step','2 screens','1'],
  ['Approvals (RTS, extension)','Typed “SMD/FAD Manager Approved” dates; typed approver name','Approve button in Approval › Approvals; user and time recorded','typed dates / names','1 click each'],
  ['Correcting a date','Change date with a reason (Document Monitoring only)','Change date with a reason on every unit (kept from V1)','—','only when needed'],
  ['Where is this unit?','Look through up to ~9 lists in FAD, SMD and VWD','One unit page: next action, timeline, money, history','several screens','1 page']];
  return head(['Concept'],'V1 vs V2','Per step of one lot’s life. “Touches” = what a JBAP user does by hand. V2 numbers are design targets that depend on the checks in v2-concept/README.md.')+
  `<div class="kpis v2"><div class="kpi"><div class="k">Screens</div><div class="v">39 → 21</div><div class="s">14 new or changed + 7 kept as V1</div></div><div class="kpi"><div class="k">Typed date fields, normal flow</div><div class="v">21 → 0</div><div class="s">Change date stays for corrections</div></div>
  <div class="kpi"><div class="k">“For …?” tick columns</div><div class="v">9 → 0</div><div class="s">Scheduled send with Hold</div></div><div class="kpi"><div class="k">Touches per normal lot</div><div class="v">±15–20 → ±4–6</div><div class="s">design target</div></div></div>`+
  card('Step by step',R.length,`<div class="tb">${Object.keys(SRC).map(k=>chip(k)).join(' ')}<span>how each date is recorded in V2</span></div><div class="tw"><table><thead><tr>${['Step','V1 (current prototype)','V2 (this concept)','V1 touches','V2 touches'].map(h=>`<th><span class="hb">${h}</span></th>`).join('')}</tr></thead><tbody>
  ${R.map(r=>`<tr><td class="wrapcell" style="min-width:140px"><b>${r[0]}</b></td><td class="wrapcell">${r[1]}</td><td class="wrapcell">${r[2]}</td><td class="wrapcell" style="min-width:110px">${r[3]}</td><td class="wrapcell" style="min-width:110px">${r[4]}</td></tr>`).join('')}</tbody></table></div><div class="pg"></div>`)}

/* ===== Menu (CDMS sidebar; FAD/SMD/VWD kept, contents reduced) ===== */
const MENU=[['Dashboard','dashboard'],['Customer','customer',[['Customer Inquiry','Customer/customer-inquiry']]],['Seller Inquiry','seller-inquiry'],['Cars','cars'],['Master','master',[['Holiday List (as V1)',null]]],
  ['Auction','auction',[['Result Price','Auction/result-price',null,1]]],['Live Auction','live-auction'],['Live Result','live-result'],['Market Search','market-search'],
  ['Report','report',[['Pipeline','Report/pipeline',null,1],['Rebate Monitoring (as V1)',null],['Liability to Seller (as V1)',null],['Inventory Summary (as V1)',null],['Cancellation Monitoring (as V1)',null]]],
  ['Approval','APP',[['Approvals','Approval/approvals',()=>pendingApprovals().length,1]]],
  ['FAD','FAD',[['My Tasks','FAD/my-tasks',()=>tasks().T.filter(t=>t.dept==='FAD').length,1],['Settlement Run','FAD/settlement-run',()=>runLots().length,1],['Documents','FAD/documents',null,1],['Security Bond (as V1)',null]]],
  ['SMD','SMD',[['My Tasks','SMD/my-tasks',()=>tasks().T.filter(t=>t.dept==='SMD').length,1],['SAAF','SMD/saaf',()=>S.saafs.filter(f=>f.status!=='signed').length,1],['Return to Seller (as V1, approvals in inbox)',null]]],
  ['VWD','VWD',[['My Tasks','VWD/my-tasks',()=>tasks().T.filter(t=>t.dept==='VWD').length,1]]],
  ['Sales Summary','sales-summary'],['Cashier Closing','cashier-closing'],['Deposit','deposit'],['Payment','payment',[['Bank Transfer','Payment/bank-transfer',null,1]]],['Inspection','inspection'],['Staff','staff'],['Log Activity','LOG',null]];
function renderMenu(route){$('#menu').innerHTML=MENU.map(([t,ic,items])=>{const icon=DEPT_ICON[ic]?deptSvg(ic):`<img src="${ASSETS["ic-"+ic]}" alt="">`;
    if(t==='Log Activity')return `<a class="mi ${route==='log'?'is-active':''}" href="#/log">${icon}Log Activity</a>`;
    if(!items)return `<button type="button" class="mi is-disabled" aria-disabled="true" data-disabled="${t}">${icon}${t}</button>`;
    const open=!!OPEN[t];
    return `<button type="button" class="mi" data-group="${t}" aria-expanded="${open}">${icon}${t}<span class="caret"></span></button><div class="lvs" ${open?'':'hidden'}>${items.map(([n,h,c,isV2])=>h?`<a class="mis ${route.startsWith(h)?'is-active':''}" href="#/${h}">${n}${isV2?'<span class="v2tag">V2</span>':''}${c?`<span class="cnt">${c()}</span>`:''}</a>`:`<button type="button" class="mis is-disabled" aria-disabled="true" data-disabled="${n}">${n}</button>`).join('')}</div>`}).join('')+
  '<p class="side-note">V2 concept: green V2 tags mark new or changed screens. Items marked “as V1” keep the V1 prototype design. Other menus are existing CDMS and not part of this concept.</p>'}

/* ===== Sidebar open/close: desktop collapses, narrow screens use an overlay with a backdrop ===== */
const narrow=()=>window.matchMedia('(max-width:1100px)').matches;
function setCollapsed(v){document.body.classList.toggle('nav-collapsed',v);try{localStorage.setItem('v2navCollapsed',v?'1':'0')}catch(e){}}
function closeNav(){document.body.classList.remove('nav-open')}
try{if(localStorage.getItem('v2navCollapsed')==='1')document.body.classList.add('nav-collapsed')}catch(e){}

/* ===== Modal, toasts, render ===== */
let modalOk=null;
function err(m){const b=$('#modal .modal-b');let e=b.querySelector('.msg.error');if(!e){e=document.createElement('div');e.className='msg error';e.style.margin='0 0 10px';b.prepend(e)}e.textContent=m;return false}
function modal(title,body,ok,okText,okCls){modalOk=ok||null;$('#modal').innerHTML=`<div class="modal-bg" data-bg><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h">${title}<button type="button" class="x" data-close aria-label="Close">×</button></div><div class="modal-b">${body}</div>
  <div class="modal-f"><button type="button" class="btn gh" data-close>${ok?'Cancel':'Close'}</button>${ok?`<button type="button" class="btn ${okCls||'pr'}" data-ok>${okText||'OK'}</button>`:''}</div></div></div>`;
  setTimeout(()=>{const f=$('#modal input:not([readonly]):not([type=checkbox])');(f||$('#modal [data-ok]')||$('#modal [data-close]'))?.focus()},0)}
const closeModal=()=>{$('#modal').innerHTML='';modalOk=null};
function demoModal(){modal('Demo events',`<p class="note" style="padding:0 0 10px">In V2 most dates are set by events, not typed. Press one and watch My Tasks, the unit pages and Log Activity change. Demo date: <b>${fmt(S.today)}</b>.</p>
  <div class="demo-btns">${btn('Import bank statement (Payment › Bank Transfer)','sim:bank','ol')}${btn('A seller returns a signed SAAF (SMD records it)','sim:seller','ol')}${btn('A buyer completes KYC in the portal','sim:kyc','ol')}${btn(`Run today’s ${CUTOFF} send (scheduled emails go out)`,'sim:cutoff','ol')}${btn(`Next working day ▶ (${CUTOFF} send, then reminders, deadlines, penalties)`,'sim:day','pr')}${btn('Reset demo data','sim:reset','gh')}</div>`)}
function flushToasts(){const w=$('#toasts');const n=toastQ.length;toastQ.slice(-2).forEach(m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;w.appendChild(d);setTimeout(()=>d.remove(),3500)});
  if(n>2){const d=document.createElement('div');d.className='toast';d.innerHTML=`+${n-2} more · <a href="#/log" style="color:#fff">Log Activity</a>`;w.appendChild(d);setTimeout(()=>d.remove(),3500)}
  while(w.children.length>3)w.firstChild.remove();toastQ=[]}
function toast(m){toastQ.push(m);flushToasts()}
function render(){const h=(location.hash||'#/').slice(2),p=h.split('/');
  $('#today').textContent='Demo date '+fmt(S.today);renderMenu(h);
  const v=h===''?vHome():p[0]==='unit'?vUnit(p[1]):p[0]==='customer'?vCustomer(p[1]):p[1]==='my-tasks'&&['FAD','SMD','VWD'].includes(p[0])?vTasks(p[0],p[2]):h==='FAD/settlement-run'?vSettlement():h==='SMD/saaf'?vSaaf():h==='FAD/documents'?vDocs():
    h==='Approval/approvals'?vApprovals():h==='Auction/result-price'?vResultPrice():h==='Payment/bank-transfer'?vBank():h==='Report/pipeline'?vPipeline():h==='Customer/customer-inquiry'?vCustomers():h==='log'?vLog():h==='compare'?vCompare():vHome();
  $('#content').innerHTML=v;flushToasts()}
function after(){runAuto();render()}
document.addEventListener('click',ev=>{const t=ev.target;
  if(t.closest('#burger')){if(narrow())document.body.classList.toggle('nav-open');else setCollapsed(!document.body.classList.contains('nav-collapsed'));return}
  if(t.closest('#scrim')){closeNav();return}
  const g=t.closest('[data-group]');if(g){OPEN[g.dataset.group]=!OPEN[g.dataset.group];renderMenu((location.hash||'#/').slice(2));return}
  const dis=t.closest('[data-disabled]');if(dis){toast(`“${dis.dataset.disabled}” is not part of this V2 concept.`);return}
  if(t.closest('.mis, a.mi')&&narrow())closeNav();
  if(t.closest('[data-open=demo]')){demoModal();return}
  if(t.closest('[data-close]')){closeModal();return}
  if(t.closest('[data-ok]')){if(modalOk&&modalOk()===false)return;closeModal();after();return}
  const s=t.closest('[data-lsort]');if(s){const[id,i]=s.dataset.lsort.split(':'),u=U(id);if(u.sort===+i)u.dir=-u.dir;else{u.sort=+i;u.dir=1}render();return}
  const pg=t.closest('[data-lpage]');if(pg){if(pg.disabled)return;const[id,i]=pg.dataset.lpage.split(':');U(id).page=+i;render();return}
  const rs=t.closest('[data-lreset]');if(rs){const u=U(rs.dataset.lreset);u.f={};u.page=0;render();return}
  const b=t.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a.startsWith('sim:')){const inDemo=!!t.closest('.demo-btns');SIM[a.slice(4)]();after();if(inDemo)demoModal();return}
  if(a==='approve'||a==='reject'){decide(b.dataset.arg,a==='approve');if(a==='approve')after();else render();return}
  ACT[a](lot(b.dataset.lot),b.dataset.arg);
  if(!$('#modal').innerHTML)after();else render()});
let bgDown=false;
document.addEventListener('mousedown',ev=>{bgDown=!!(ev.target.hasAttribute&&ev.target.hasAttribute('data-bg'))});
document.addEventListener('mouseup',ev=>{if(bgDown&&ev.target.hasAttribute&&ev.target.hasAttribute('data-bg'))closeModal();bgDown=false});
document.addEventListener('submit',ev=>{const f=ev.target.closest('[data-lform]');if(!f)return;ev.preventDefault();const u=U(f.dataset.lform);u.f=Object.fromEntries(new FormData(f));u.page=0;render()});
document.addEventListener('change',ev=>{const s=ev.target.closest('[data-lsize]');if(s){const u=U(s.dataset.lsize);u.size=+s.value;u.page=0;render()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if($('#modal').innerHTML)closeModal();else closeNav()});
window.addEventListener('hashchange',()=>{const p=(location.hash||'').slice(2).split('/')[0];if(p in OPEN)OPEN[p]=true;closeModal();render();window.scrollTo(0,0)});
window.addEventListener('resize',()=>{if(!narrow())closeNav()});
runAuto();S.feed=[];toastQ=[];render();
</script>
</body>
</html>
